<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CHOI 1단계 대시보드 — 명상·심리치유 공모사업</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --paper:#F6F8F6; --surface:#FFFFFF; --sunken:#EDF1EE; --ink:#151E1B; --ink-2:#3A4744;
  --muted:#5E6A65; --rule:#DCE3DF; --rule-strong:#C2CDC7;
  --accent:#2F6F62; --accent-soft:#E1EEE9; --on-accent:#FFFFFF;
  --signal:#8A5A12; --signal-soft:#F6ECDA;
  --critical:#993A30; --critical-soft:#F7E4E1;
  --info:#2C5A80; --info-soft:#E2ECF4;
  --shadow:0 1px 2px rgba(21,30,27,.05),0 8px 24px -16px rgba(21,30,27,.28);
  /* Nanum Myeongjo 도 Windows 기본 미설치, Georgia 는 한글 없음 → 바탕 추가 */
  --f-display:"Gowun Batang","Nanum Myeongjo","바탕","Batang",Georgia,serif;
  --f-body:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono","D2Coding",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#101614; --surface:#18201D; --sunken:#141B19; --ink:#E7EDE9; --ink-2:#BAC6C1;
    --muted:#8B9994; --rule:#2A3531; --rule-strong:#3C4A45;
    --accent:#74C4AE; --accent-soft:#1B2E29; --on-accent:#0C1210; --on-accent:#0C1210;
    --signal:#D8A75E; --signal-soft:#2E2519;
    --critical:#E28D80; --critical-soft:#33201D;
    --info:#7FB0D6; --info-soft:#182632;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --paper:#101614; --surface:#18201D; --sunken:#141B19; --ink:#E7EDE9; --ink-2:#BAC6C1;
  --muted:#8B9994; --rule:#2A3531; --rule-strong:#3C4A45;
  --accent:#74C4AE; --accent-soft:#1B2E29; --on-accent:#0C1210;
  --signal:#D8A75E; --signal-soft:#2E2519;
  --critical:#E28D80; --critical-soft:#33201D;
  --info:#7FB0D6; --info-soft:#182632;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -16px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);
  font-size:15.5px;line-height:1.65;-webkit-font-smoothing:antialiased;word-break:keep-all}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.wrap{width:min(1240px,100% - 2.5rem);margin-inline:auto}

/* header */
.mast{border-bottom:1px solid var(--rule);background:linear-gradient(180deg,var(--sunken),var(--paper));position:sticky;top:0;z-index:50;backdrop-filter:blur(6px)}
.mast-inner{padding:1.1rem 0 0;display:flex;flex-direction:column;gap:.85rem}
.mast-top{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:.6rem}
.brand{display:flex;align-items:baseline;gap:.8rem;flex-wrap:wrap}
/* 음수 자간은 라틴 전용이다. 한글, 특히 명조는 획이 가늘어 붙음이 더 드러난다 */
.brand h1{font-family:var(--f-display);font-weight:600;font-size:1.05rem;margin:0;letter-spacing:0}
.brand .sub{font-family:var(--f-mono);font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.mast-meta{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);display:flex;gap:1.1rem;flex-wrap:wrap}
nav{display:flex;gap:.15rem;overflow-x:auto;padding-bottom:0}
nav button{appearance:none;border:0;background:transparent;font-family:var(--f-body);font-size:.87rem;
  font-weight:500;color:var(--muted);padding:.6rem .85rem;cursor:pointer;white-space:nowrap;
  border-bottom:2px solid transparent;transition:color .12s}
nav button:hover{color:var(--ink)}
nav button[aria-current="page"]{color:var(--accent);border-bottom-color:var(--accent)}
nav .n{font-family:var(--f-mono);font-size:.7rem;margin-left:.3rem;color:var(--muted)}

main{padding:1.9rem 0 5rem}
.sec-title{font-family:var(--f-display);font-weight:700;font-size:1.6rem;margin:0 0 .3rem;letter-spacing:0}
.sec-desc{color:var(--ink-2);font-size:.92rem;margin:0 0 1.2rem;max-width:74ch}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(158px,1fr));gap:1px;background:var(--rule);
  border:1px solid var(--rule);border-radius:3px;overflow:hidden;margin-bottom:1.6rem}
.kpi{background:var(--surface);padding:.95rem 1rem;display:flex;flex-direction:column;gap:.12rem}
.kpi dt{font-size:.72rem;color:var(--muted);order:2;letter-spacing:.02em}
.kpi dd{margin:0;order:1;font-family:var(--f-mono);font-weight:600;font-size:1.25rem;
  line-height:1.2;font-variant-numeric:tabular-nums}
.kpi .note{order:3;font-size:.7rem;color:var(--muted);margin-top:.2rem}
.kpi.ok dd{color:var(--accent)} .kpi.warn dd{color:var(--signal)} .kpi.crit dd{color:var(--critical)}

/* cards / panels */
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:3px;padding:1.15rem 1.25rem;box-shadow:var(--shadow)}
.panel + .panel{margin-top:1rem}
.panel h3{font-family:var(--f-body);font-weight:600;font-size:1rem;margin:0 0 .6rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:1rem}

/* callout */
.call{border:1px solid var(--rule-strong);border-left:3px solid var(--accent);background:var(--surface);
  border-radius:0;padding:1rem 1.15rem;margin-bottom:1.2rem}
.call.warn{border-left-color:var(--signal);background:var(--signal-soft)}
.call.crit{border-left-color:var(--critical);background:var(--critical-soft)}
.call.info{border-left-color:var(--info);background:var(--info-soft)}
.call .lab{font-family:var(--f-mono);font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;
  font-weight:600;color:var(--accent);display:block;margin-bottom:.35rem}
.call.warn .lab{color:var(--signal)} .call.crit .lab{color:var(--critical)} .call.info .lab{color:var(--info)}
.call p{margin:0 0 .5rem;font-size:.92rem}.call p:last-child{margin:0}

/* table */
.tw{max-height:min(70vh,720px);overflow:auto;overscroll-behavior:contain;
  border:1px solid var(--rule);border-radius:3px;background:var(--surface)}
/* 본문 1.65 는 한글 장문에 맞지만 203행 표에는 과하다 */
table{border-collapse:collapse;width:100%;font-size:.86rem;min-width:640px;line-height:1.45}
th,td{padding:.55rem .75rem;text-align:left;vertical-align:top;border-bottom:1px solid var(--rule)}
thead th{background:var(--sunken);font-weight:600;font-size:.72rem;letter-spacing:.05em;color:var(--muted);
  white-space:nowrap;border-bottom:1px solid var(--rule-strong);position:sticky;top:0;z-index:3;cursor:pointer;user-select:none}
thead th:hover{color:var(--ink)}
thead th .ar{font-family:var(--f-mono);font-size:.65rem;margin-left:.2rem;color:var(--accent)}
tbody tr:hover{background:var(--sunken)}
tbody tr:last-child td{border-bottom:0}
td.mono,.mono{font-family:var(--f-mono);font-size:.78rem}
td.num{font-family:var(--f-mono);text-align:right;font-variant-numeric:tabular-nums}
a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent}
a:hover{border-bottom-color:var(--accent)}

/* chips */
.chip{display:inline-block;font-family:var(--f-body);font-size:.68rem;font-weight:500;letter-spacing:.03em;
  padding:.1rem .42rem;border-radius:2px;white-space:nowrap;border:1px solid var(--rule-strong);
  color:var(--ink-2);background:var(--sunken)}
.chip.ok{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.chip.warn{color:var(--signal);border-color:var(--signal);background:var(--signal-soft)}
.chip.crit{color:var(--critical);border-color:var(--critical);background:var(--critical-soft)}
.chip.info{color:var(--info);border-color:var(--info);background:var(--info-soft)}
.chips{display:flex;flex-wrap:wrap;gap:.32rem}

/* 사용법 탭 — 마크다운 렌더 (기존 색 토큰만 씀) */
.md-body{max-width:74ch;line-height:1.75}
.md-p{margin:10px 0;color:var(--ink)}
.md-ol{margin:.4rem 0 .6rem;padding-left:1.4rem}
.md-ol li{margin-bottom:.25rem}
.md-ul{margin:8px 0 12px 1.1rem;padding:0}
.md-ul li{margin:4px 0}
.md-quote{margin:12px 0;padding:10px 14px;border-left:3px solid var(--accent);
  background:var(--sunken);border-radius:0 4px 4px 0;color:var(--ink-2)}
.md-quote b{color:var(--ink)}
.md-pre{margin:10px 0;padding:12px 14px;background:var(--sunken);border:1px solid var(--rule);
  border-radius:6px;overflow-x:auto;font-family:var(--f-mono);font-size:.84rem;line-height:1.6}
.md-table{border-collapse:collapse;margin:12px 0;font-size:.88rem;min-width:100%}
.md-table th{text-align:left;padding:7px 11px;border-bottom:2px solid var(--rule-strong);
  color:var(--muted);font-weight:600;white-space:nowrap}
.md-table td{padding:7px 11px;border-bottom:1px solid var(--rule);vertical-align:top}
.md-table tr:last-child td{border-bottom:none}
.md-body code{background:var(--sunken);padding:1px 5px;border-radius:3px;
  font-family:var(--f-mono);font-size:.86em}

/* 정렬 헤더 — th 는 포커스를 못 받으므로 안에 native button 을 넣는다 (WCAG 2.1.1) */
.th-sort{all:unset;display:flex;gap:.3rem;align-items:center;justify-content:space-between;
  width:100%;padding:.55rem .75rem;cursor:pointer;box-sizing:border-box;
  font:inherit;color:inherit;letter-spacing:inherit}
.th-sort:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
thead th:has(.th-sort){padding:0}
.th-sort .ar{opacity:.4;font-family:var(--f-mono);font-size:.65rem}
th[aria-sort]:not([aria-sort="none"]) .ar{opacity:1;color:var(--accent)}

/* 빈 상태 — 필터 0건이 막다른 길이 되지 않게 */
.empty-cell{text-align:center;padding:2.4rem 1rem}
.empty-h{font-weight:600;margin:0 0 .3rem;font-size:.95rem}
.empty-cell .small{margin:0 0 .9rem}

/* 탭 그룹 경계 — 9개가 균일하면 아무것도 그룹으로 읽히지 않는다 */
.nav-sep{width:1px;background:var(--rule-strong);margin:.45rem .75rem;align-self:stretch}

.table-bar{display:flex;justify-content:flex-end;margin-bottom:.4rem}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:.55rem;margin-bottom:.9rem;align-items:center}
input[type=search],select{font-family:var(--f-body);font-size:.86rem;padding:.42rem .65rem;
  border:1px solid var(--rule-strong);border-radius:3px;background:var(--surface);color:var(--ink);min-width:0}
input[type=search]{flex:1;min-width:190px}
.count{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);margin-left:auto}
.pill{appearance:none;font-family:var(--f-body);font-size:.8rem;padding:.3rem .7rem;border-radius:99px;
  border:1px solid var(--rule-strong);background:var(--surface);color:var(--ink-2);cursor:pointer}
.pill[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:500}

/* bar viz */
.bars{display:flex;flex-direction:column;gap:.5rem}
.bar-row{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:.7rem;align-items:center;font-size:.84rem}
.bar-track{background:var(--sunken);border-radius:2px;height:16px;overflow:hidden;border:1px solid var(--rule)}
/* display:block 이 없으면 span 이 inline 이라 width·height 가 통째로 무시된다.
   트랙은 grid item 이라 자동으로 block 이 되지만 그 자식인 fill 은 아니다 —
   실측에서 fill 의 실제 크기가 0×0 이었다(막대가 전부 빈 채로 보였다). */
.bar-fill{display:block;height:100%;background:var(--accent);border-radius:1px;min-width:2px}
.bar-fill.warn{background:var(--signal)} .bar-fill.crit{background:var(--critical)} .bar-fill.info{background:var(--info)}
.bar-val{font-family:var(--f-mono);font-size:.76rem;color:var(--muted);font-variant-numeric:tabular-nums;min-width:44px;text-align:right}

/* expandable */
details{border:1px solid var(--rule);border-radius:3px;background:var(--surface);margin-bottom:.55rem}
details summary{padding:.7rem .95rem;cursor:pointer;font-weight:500;font-size:.92rem;list-style:none;display:flex;gap:.6rem;align-items:baseline}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸";color:var(--accent);font-size:.8rem;transition:transform .15s}
details[open] summary::before{content:"▾"}
details .body{padding:0 .95rem .9rem 2.1rem;font-size:.88rem;color:var(--ink-2);white-space:pre-wrap}
.rank{font-family:var(--f-mono);font-weight:600;color:var(--accent);font-size:.8rem}

/* ch 는 라틴 0 폭 기준이라 한글에서 82ch = 약 53자로 과하다 */
.prose{white-space:pre-wrap;font-size:.9rem;line-height:1.72;color:var(--ink-2);max-width:42em}
.small{font-size:.79rem;color:var(--muted)}
.loading{padding:4rem 0;text-align:center;color:var(--muted);font-family:var(--f-mono);font-size:.85rem}
footer{border-top:1px solid var(--rule);background:var(--sunken);margin-top:3rem;padding:1.6rem 0 2.4rem}
footer .wrap{font-size:.8rem;color:var(--muted)}
.nav-act{appearance:none;border:1px solid var(--accent);border-radius:8px;
  background:var(--accent-soft);color:var(--accent);font-family:var(--f-body);
  font-size:.82rem;font-weight:700;padding:.35rem .7rem;margin:0 .3rem;
  cursor:pointer;align-self:center;white-space:nowrap}
.nav-act:hover{background:var(--accent);color:var(--on-accent)}
.rfBar{height:10px;background:var(--sunken);border-radius:5px;overflow:hidden}
.rfBar i{display:block;height:100%;background:var(--accent);border-radius:5px;
  transition:width .6s}

/* ── 전역 AI 제안 ── */
.aiFab{position:fixed;right:18px;bottom:18px;z-index:90;
  background:var(--accent);color:var(--on-accent);border:0;border-radius:99px;
  padding:.7rem 1.15rem;font-family:var(--f-body);font-size:.92rem;font-weight:700;
  cursor:pointer;box-shadow:var(--shadow)}
.aiFab:hover{filter:brightness(1.08)}
.aiDrawer{position:fixed;right:18px;bottom:74px;z-index:91;
  width:min(430px,calc(100vw - 36px));max-height:min(72vh,640px);overflow-y:auto;
  background:var(--surface);border:1px solid var(--rule-strong);border-radius:12px;
  padding:14px 16px;box-shadow:var(--shadow)}
.aiHead{display:flex;align-items:center;justify-content:space-between;gap:6px;
  margin-bottom:8px;flex-wrap:wrap}
.aiDrag{cursor:move;touch-action:none;user-select:none;
  margin:-14px -16px 8px;padding:10px 16px 8px;
  border-bottom:1px solid var(--rule);border-radius:12px 12px 0 0;
  background:var(--sunken)}
.aiDrag:active{cursor:grabbing}
/* 작업줄 — 잠깐 내려 두고 본문을 읽을 때 */
.aiBar{position:fixed;left:12px;right:12px;bottom:12px;z-index:91;
  display:flex;align-items:center;gap:10px;cursor:pointer;
  background:var(--surface);border:1px solid var(--accent);border-radius:10px;
  padding:.5rem .8rem;box-shadow:var(--shadow)}
.aiBar:hover{background:var(--accent-soft)}
@media (min-width:900px){.aiBar{left:auto;width:min(560px,60vw)}}
.aiBody{font-size:.86rem;line-height:1.65}
.aiBody table{min-width:0}
@media (max-width:640px){
  .aiDrawer{right:10px;left:10px;width:auto;bottom:70px}
  .aiFab{right:12px;bottom:12px}
}

.aiPick{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.webTgl{flex:0 0 auto;font-size:.76rem;padding:.3rem .5rem;white-space:nowrap}
.webTgl.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);
  font-weight:600}
.webCite{margin:.3rem 0 0;padding-left:1.2rem}
.webCite li{margin-bottom:.15rem;word-break:break-word}
.aiPick select{flex:1;min-width:0;font-size:.8rem;padding:.3rem .45rem}
.aiLog{max-height:46vh;overflow-y:auto;margin-bottom:8px;padding-right:2px}
.aiMsg{display:flex;margin-bottom:8px}
.aiMsg.user{justify-content:flex-end}
.aiBubble{max-width:92%;padding:.5rem .7rem;border-radius:10px;font-size:.85rem;line-height:1.6}
.aiBubble.u{background:var(--accent-soft);border:1px solid var(--accent);color:var(--ink)}
.aiBubble.a{background:var(--sunken);border:1px solid var(--rule)}
.aiInput{display:flex;gap:6px}
.aiInput input{flex:1;min-width:0}

.kwChip{appearance:none;font-family:var(--f-body);font-size:.8rem;cursor:pointer;
  padding:.28rem .6rem;border-radius:6px;border:1px solid var(--rule-strong);
  background:var(--surface);color:var(--ink-2);transition:all .12s}
.kwChip:hover{border-color:var(--accent);color:var(--accent)}
.kwChip.t-ok{border-color:var(--accent);color:var(--accent)}
.kwChip.t-crit{border-color:var(--critical);color:var(--critical)}
.kwChip.t-info{border-color:var(--info);color:var(--info)}
.kwChip.on{background:var(--accent);border-color:var(--accent);
  color:var(--on-accent);font-weight:700}
.kwChip.on.t-crit{background:var(--critical);border-color:var(--critical)}
@media (pointer:coarse){.kwChip{min-height:40px;padding:.45rem .7rem}}

/* ── 키워드 네트워크 ── */
.knGrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:.8rem}
.knCanvasBox{padding:.8rem .9rem}
.knCanvas{width:100%;height:430px;display:block;cursor:grab;touch-action:none;margin-top:6px}
.knCanvas:active{cursor:grabbing}
.knLegend{display:flex;gap:.9rem;flex-wrap:wrap;margin-top:4px;color:var(--muted)}
.knLegend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.knSide{max-height:560px;overflow-y:auto}
.knBar{display:flex;align-items:center;gap:8px;padding:3px 0;cursor:pointer}
.knBar:hover .knBarName{color:var(--accent)}
.knBarName{flex:0 0 96px;font-size:.8rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.knBarTrack{flex:1;height:8px;background:var(--sunken);border-radius:4px;overflow:hidden}
.knBarTrack i{display:block;height:100%;background:var(--accent);border-radius:4px}
.knTrend{display:flex;gap:4px;align-items:flex-end}
.knTrend>div{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
.knTrend i{display:block;width:100%;max-width:26px;background:var(--accent);border-radius:3px 3px 0 0;opacity:.85}
.knTrend span{font-size:.62rem;color:var(--muted);font-family:var(--f-mono)}
.knRag{border-left:3px solid var(--rule-strong);padding:4px 0 4px 10px;margin-bottom:8px}
.knRag blockquote{margin:.3rem 0 0;color:var(--ink-2);font-style:normal}
@media (max-width:900px){.knGrid{grid-template-columns:1fr}.knCanvas{height:330px}.knSide{max-height:none}}

.srcTabs{display:flex;gap:.5rem;flex-wrap:wrap}
.srcTab{flex:1 1 240px;text-align:left;cursor:pointer;font-family:var(--f-body);
  background:var(--surface);color:var(--ink-2);border:1px solid var(--rule-strong);
  border-radius:6px;padding:.55rem .85rem;font-size:.88rem;font-weight:600;
  transition:border-color .15s,color .15s,background .15s}
.srcTab span{display:block;font-weight:400;font-size:.74rem;margin-top:.15rem;opacity:.85}
.srcTab:hover{border-color:var(--accent);color:var(--ink)}
.srcTab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.path{font-family:var(--f-mono);font-size:.72rem;color:var(--ink-2);word-break:break-all}
/* ── 화면 모드 전환 버튼 ──────────────────────────────────
   aicoach.camp 방식: 아이콘이 **바뀔 모드**를 가리킨다. 최소 40px 정사각으로
   손가락 터치를 받는다(iOS 44 / Android 48 권고에 근접). */
.themeBtn{display:inline-flex;align-items:center;gap:.35rem;min-height:40px;padding:0 .7rem;
  border:1px solid var(--rule-strong);border-radius:10px;background:var(--surface);
  color:var(--ink-2);font-family:var(--f-body);font-size:.95rem;cursor:pointer;
  margin-right:.5rem;transition:border-color .15s,color .15s,background .15s}
.themeBtn:hover{border-color:var(--accent);color:var(--ink)}
.themeBtn em{font-style:normal;font-size:.74rem;font-family:var(--f-mono);letter-spacing:.02em}

/* ── 손가락으로 쓰는 기기 (폭과 무관) ────────────────────────
   폭 조건으로 걸면 **아이폰을 가로로 돌리는 순간 규칙이 꺼진다**(844·932px).
   iOS 사파리의 포커스 자동 확대는 뷰포트 폭이 아니라 요소의 font-size 로
   결정되므로, 가로에서도 포커스마다 화면이 튀고 되돌아오지 않았다.
   터치 타깃도 같은 이유로 폭이 아니라 포인터 종류로 건다. */
@media (pointer:coarse){
  input,select,textarea{font-size:16px!important}
  .btn,.pill,.themeBtn{min-height:44px}
  .th-sort{min-height:44px}
  details summary{min-height:48px;align-items:center}
  /* 표 안 링크: 밑줄이 :hover 에서만 켜져 터치 기기엔 영영 안 보였다 */
  td a{display:inline-block;padding:.5rem 0;border-bottom-color:var(--accent)}
}

/* ── 모바일 (~640px) ──────────────────────────────────────
   실측 근거(375px): 헤더가 세로를 크게 먹고, 인라인 width 가 박힌 입력들이
   뷰포트를 넘고, 버튼이 손가락보다 작았다. 스크롤 가능한 표·네비는 그대로 둔다. */
@media (max-width:640px){
  body{font-size:15px}
  .bar-row{grid-template-columns:minmax(70px,110px) 1fr auto}

  /* 좌우 여백을 줄여 본문 폭을 되찾는다 (2.5rem -> 1.5rem) */
  .wrap{width:min(1240px,100% - 1.5rem)}

  /* 머리말: 제목을 줄이고 통계는 접는다 — 세로가 가장 귀한 자원이다 */
  .mast-inner{padding-top:.7rem;gap:.55rem}
  .mast-top{align-items:center}
  .brand h1{font-size:1.02rem;line-height:1.3}
  .mast-meta{font-size:.66rem;gap:.55rem;width:100%;order:3}
  .mast-meta span{white-space:nowrap}

  /* 네비: 이미 가로 스크롤이지만 더 있다는 걸 알려 준다 */
  nav{gap:0;-webkit-overflow-scrolling:touch;scrollbar-width:none;
      -webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);
      mask-image:linear-gradient(90deg,#000 88%,transparent)}
  nav::-webkit-scrollbar{display:none}
  nav button{padding:.55rem .6rem;font-size:.84rem;min-height:44px}

  /* 인라인 width(240·280·200·120px)가 박힌 입력들 — 좁은 화면에선 전부 폭을 채운다.
     JSX 인라인 스타일이라 CSS 로 이기려면 !important 가 필요하다. */
  .controls{gap:.5rem}
  .controls>input,.controls>select,.controls>.btn{
    width:100%!important;max-width:none!important;min-width:0}
  /* 터치 타깃 — 모바일에서 더 여유 있게 */
  .btn{padding:.6rem .85rem;font-size:.9rem}
  .pill{min-height:48px;padding:.6rem .95rem}
  .themeBtn{min-height:48px}
  .th-sort{min-height:44px;padding:.7rem .75rem}

  /* 드롭존은 한 줄에 하나 — 2열로 붙으면 글자가 세 줄로 접힌다.
     JSX 에 인라인 flex:1(basis 0%)이 박혀 있어 !important 로 눌러야 한다.
     (중요도 있는 author 규칙은 인라인 스타일을 이긴다) */
  .drop{padding:26px 14px}
  .controls>.drop{flex-basis:100%!important;min-width:0}

  /* 단계 목록의 들여쓰기를 줄여 본문 폭 확보 (34+11 -> 24+9) */
  .steps>li{padding-left:24px;margin-left:9px}
  .steps>li::before{left:-11px;width:20px;height:20px;font-size:11px}

  /* 작성 갈래 토글은 세로로 쌓아 두 갈래를 다 보이게 */
  .srcTab{flex:1 1 100%;min-height:52px}

  /* 표는 .tw 안에서 가로로 스크롤된다 — 높이만 낮춰 화면을 덜 먹게 */
  .tw{max-height:min(60vh,520px)}
}

/* 아주 좁은 화면 (~380px) — 통계 **숫자만** 감춰 첫 화면을 비운다.
   .mast-meta 통째로 숨기면 그 안에 있는 화면 모드 버튼까지 사라진다(실측). */
@media (max-width:380px){
  .mast-meta>span{display:none}
  .brand .sub{font-size:.62rem}
}
@media print{
  .tw{max-height:none;overflow:visible}
  .mast{position:static;backdrop-filter:none}
  nav,.controls{display:none}
  details{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── 작성 준비 탭 (Step 2.4 업로더) ────────────────────────── */
.drop{border:2px dashed var(--rule);border-radius:10px;padding:22px 16px;text-align:center;
      background:var(--sunken);transition:border-color .15s,background .15s;cursor:pointer}
.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop .big{font-size:15px;font-weight:600;margin-bottom:4px}
.filelist{list-style:none;padding:0;margin:10px 0 0}
.filelist li{display:flex;gap:10px;align-items:center;padding:7px 10px;border:1px solid var(--rule);
             border-radius:8px;margin-bottom:6px;background:var(--paper)}
.filelist .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.filelist .sz{color:var(--muted);font-size:12px;white-space:nowrap}
.ta{width:100%;min-height:150px;font:13px/1.6 var(--f-mono);padding:10px;border:1px solid var(--rule);
    border-radius:8px;background:var(--paper);color:var(--ink);resize:vertical}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border:1px solid var(--rule);
     border-radius:8px;background:var(--paper);color:var(--ink);font-size:13px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
/* 인라인 style 로 버튼을 줄이던 곳이 9군데였다. 인라인은 스타일시트를
   이기므로 미디어쿼리로 되돌릴 수 없었다 — 클래스로 옮겨 정리한다.
   높이는 min-height 가 지키고, .sm 은 좌우 여백만 줄인다. */
.btn.sm{padding:3px 9px;font-size:12px}
/* 다크 모드의 accent 는 밝은 민트다 — 흰 글자를 얹으면 대비 2.05 로
   읽히지 않는다(실측). 모드별로 얹을 글자색을 토큰으로 갖는다. */
.btn.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hl{background:var(--accent-soft);border-radius:3px;padding:0 2px;font-weight:600}
.steps{counter-reset:st;list-style:none;padding:0;margin:0}
.steps>li{counter-increment:st;position:relative;padding:0 0 16px 34px;border-left:2px solid var(--rule);
          margin-left:11px}
.steps>li:last-child{border-left-color:transparent;padding-bottom:0}
.steps>li::before{content:counter(st);position:absolute;left:-12px;top:-2px;width:22px;height:22px;
   border-radius:50%;background:var(--sunken);border:1px solid var(--rule);display:grid;place-items:center;
   font-size:12px;font-weight:700;color:var(--muted)}
.steps>li.done::before{content:'✓';background:var(--accent-soft);border-color:var(--accent);
   color:var(--accent)}
</style>
</head>
<body>
<div id="root"><div class="loading">대시보드를 불러오는 중…</div></div>

<!-- 데이터: script 태그로 읽는다. file:// 에서 fetch 는 차단되지만 script 는 되기 때문에
     이 대시보드는 더블클릭만으로 열린다. 없으면 아래 앱이 fetch 로 폴백한다. -->
<script src="./data.js" onerror="window.__dataScriptFailed=true"></script>
<script src="./market.js" onerror="window.__marketScriptMissing=true"></script>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

<!-- data-type="module" 을 붙이면 Babel 이 ES 모듈로 실행하고,
     ES 모듈은 CORS 대상이라 file:// (불투명 origin) 에서 차단된다.
     import/export 를 쓰지 않으므로 고전 스크립트로 둔다 → 더블클릭으로 열린다. -->
<script type="text/babel">
const {useState, useEffect, useMemo, Fragment} = React;

/* ─────────────── 공용 컴포넌트 ─────────────── */

// 기계값을 화면에 그대로 내보내면 한 화면에서 레지스터가 충돌한다.
// 값(value)은 원본을 유지하고 표시만 한국어로 바꾼다 — 필터가 깨지지 않게.
const LBL = {
  openapi:'공개 API', rss:'RSS', html_list:'HTML 목록', manual_only:'수기 확인만',
  unknown:'미확인', allowed:'상업이용 가능', restricted:'조건부 허용',
  prohibited:'상업이용 금지', file:'파일', standard:'표준데이터',
  low:'낮음', medium:'보통', high:'높음',
};
const L = v => LBL[v] ?? v;

const Chip = ({k='', children, title}) => <span className={'chip ' + k} title={title}>{children}</span>;

// 지금 화면에 보이는 그 행만 내보낸다 — 필터를 적용한 결과가 곧 사용자의 의도다.
// BOM 이 없으면 엑셀이 한글을 깨뜨린다.
function downloadCSV(filename, columns, rows) {
  const esc = v => {
    const s = v == null ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const NL = String.fromCharCode(10);
  const BOM = String.fromCharCode(0xFEFF);
  const head = columns.map(c => esc(c.label)).join(',');
  const body = rows.map(r => columns.map(c => esc(c.csv ? c.csv(r) : r[c.key])).join(',')).join(NL);
  const blob = new Blob([BOM + head + NL + body], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 0);
}

function Kpi({label, value, note, tone=''}) {
  return (
    <div className={'kpi ' + tone}>
      <dd>{value}</dd>
      <dt>{label}</dt>
      {note && <span className="note">{note}</span>}
    </div>
  );
}

function Call({tone='', label, children}) {
  return (
    <div className={'call ' + tone}>
      {label && <span className="lab">{label}</span>}
      {children}
    </div>
  );
}

function Bars({rows, tone, max: fixedMax}) {
  // 여러 시리즈를 비교할 때는 호출부가 공통 최대값을 내려준다.
  // 안 내려주면 시리즈마다 100%가 되어 '격차' 차트가 격차를 못 보여준다.
  const max = fixedMax ?? Math.max(...rows.map(r => r.value), 1);
  return (
    <div className="bars">
      {rows.map((r, i) => (
        <div className="bar-row" key={i}>
          <span title={r.label}>{r.label}</span>
          <span className="bar-track">
            <span className={'bar-fill ' + (r.tone || tone || '')} style={{width: (r.value / max * 100) + '%'}} />
          </span>
          <span className="bar-val">{r.display ?? r.value}</span>
        </div>
      ))}
    </div>
  );
}

/* 정렬·검색 가능한 표 */
function DataTable({columns, rows, initialSort, emptyHint, onReset, csvName}) {
  const [sort, setSort] = useState(initialSort || null);
  const sorted = useMemo(() => {
    if (!sort) return rows;
    const {key, dir} = sort;
    const col = columns.find(c => c.key === key);
    return [...rows].sort((a, b) => {
      let va = col?.sortValue ? col.sortValue(a) : a[key];
      let vb = col?.sortValue ? col.sortValue(b) : b[key];
      if (va == null) va = col?.numeric ? -Infinity : '';
      if (vb == null) vb = col?.numeric ? -Infinity : '';
      const r = col?.numeric ? va - vb : String(va).localeCompare(String(vb), 'ko');
      return dir === 'asc' ? r : -r;
    });
  }, [rows, sort, columns]);

  const toggle = k => setSort(s => s && s.key === k ? {key: k, dir: s.dir === 'asc' ? 'desc' : 'asc'} : {key: k, dir: 'asc'});

  return (
    <Fragment>
    {csvName && sorted.length > 0 && (
      <div className="table-bar">
        <button type="button" className="pill"
          onClick={() => downloadCSV(csvName, columns, sorted)}>
          CSV 내보내기 ({sorted.length.toLocaleString()}행)
        </button>
      </div>
    )}
    <div className="tw">
      <table>
        <thead>
          <tr>{columns.map(c => (
            <th key={c.key} scope="col"
                aria-sort={sort?.key === c.key ? (sort.dir === 'asc' ? 'ascending' : 'descending') : 'none'}>
              <button type="button" className="th-sort" onClick={() => toggle(c.key)}>
                <span>{c.label}</span>
                {/* 미정렬 상태에도 ↕ 를 보여야 '정렬 가능한 열'임이 마우스 전에 보인다 */}
                <span className="ar" aria-hidden="true">
                  {sort?.key === c.key ? (sort.dir === 'asc' ? '▲' : '▼') : '↕'}
                </span>
              </button>
            </th>
          ))}</tr>
        </thead>
        {sorted.length === 0 ? (
          <tbody><tr><td colSpan={columns.length} className="empty-cell">
            <p className="empty-h">조건에 맞는 항목이 없습니다</p>
            {emptyHint && <p className="small">{emptyHint}</p>}
            {onReset && <button type="button" className="pill" onClick={onReset}>필터 초기화</button>}
          </td></tr></tbody>
        ) : (
        <tbody>
          {sorted.map((r, i) => (
            <tr key={i}>{columns.map(c => <td key={c.key} className={c.cls || ''}>{c.render ? c.render(r) : (r[c.key] ?? '')}</td>)}</tr>
          ))}
        </tbody>)}
      </table>
    </div>
    </Fragment>
  );
}

function Search({value, onChange, placeholder, count, total}) {
  return (
    <div className="controls">
      <input type="search" value={value} onChange={e => onChange(e.target.value)} placeholder={placeholder} />
      <span className="count">{count.toLocaleString()} / {total.toLocaleString()}</span>
    </div>
  );
}

/* ─────────────── 탭: 개요 ─────────────── */

function OverviewBody({d}) {
  const api = d.api_verification.apis;
  const notice = api.filter(a => a.kind === '공고');
  // '수집 가능 131' 은 낙관적 집계였다 — 그중 105 가 사이트 개편에 취약한 HTML 이다.
  // 실행 가능성 등급으로 쪼개고, 모르는 것(미확인)을 숨기지 않고 화면에 올린다.
  const stable = d.channels.filter(c => ['openapi','rss'].includes(c.access)).length;
  const fragile = d.channels.filter(c => c.access === 'html_list').length;
  const unknownCh = d.channels.filter(c => !c.access || c.access === 'unknown').length;
  const blocked = d.channels.filter(c => /차단|금지|Disallow|ClaudeBot/i.test(c.tos || '')).length;
  const commercialOk = d.datasets.filter(x => x.commercial === 'allowed').length;
  const licUnknown = d.datasets.filter(x => !x.commercial || x.commercial === 'unknown').length;

  const clusterRows = useMemo(() => {
    const m = {};
    d.channels.forEach(c => { m[c.cluster] = (m[c.cluster] || 0) + 1; });
    return Object.entries(m).map(([label, value]) => ({label, value})).sort((a, b) => b.value - a.value);
  }, [d]);

  const accessRows = useMemo(() => {
    const m = {};
    d.channels.forEach(c => { m[c.access || 'unknown'] = (m[c.access || 'unknown'] || 0) + 1; });
    const tone = {openapi:'', rss:'info', html_list:'warn', manual_only:'crit', unknown:'crit'};
    return Object.entries(m).map(([label, value]) => ({label, value, tone: tone[label] || ''})).sort((a, b) => b.value - a.value);
  }, [d]);

  return (
    <Fragment>
      <h2 className="sec-title">1단계 — 시장·채널 조사 결과</h2>
      <p className="sec-desc">명상·심리치유 분야 공모사업을 어디서 어떻게 찾을 수 있는가에 대한 전수조사 결과입니다.
        1차(채널 {d.channels.length}개 실측) + 2차(공공데이터 {d.datasets.length}건) + API 실호출 검증을 합친 것입니다.</p>

      <dl className="kpis">
        <Kpi label="안정 수집" value={stable} tone="ok" note="공개 API · RSS — 구조 변경에 강함" />
        <Kpi label="취약 수집" value={fragile} tone="warn" note="HTML 목록 — 사이트 개편에 깨짐" />
        <Kpi label="미확인 채널" value={unknownCh} tone="warn" note="접근 방식 판정 못 함" />
        <Kpi label="준법 차단" value={blocked} tone="crit" note="robots·약관 — 우회하지 않음" />
        <Kpi label="상업이용 가능" value={commercialOk} tone="ok" note="제안서에 인용 가능" />
        <Kpi label="라이선스 미확인" value={licUnknown} tone="warn" note="확인 전 인용 금지" />
        <Kpi label="공고 사례" value={d.programs.length} note="골든셋 초기 자료" />
        <Kpi label="키워드 사전" value={Object.values(d.keywords).flat().length} note="상위 프레임 축" />
      </dl>

      <Call tone="warn" label="이 숫자를 어떻게 읽어야 하는가">
        <p>발굴한 채널 <b>{d.channels.length}개</b> 중 실제로 안정적으로 수집할 수 있는 것은
          <b> {stable}개</b>입니다. 나머지 {fragile}개는 HTML 목록이라 사이트가 개편되면 깨지고,
          {unknownCh}개는 접근 방식조차 판정하지 못했습니다.</p>
        <p>공공데이터도 마찬가지입니다 — <b>미확인 {licUnknown}건이 상업이용 가능 {commercialOk}건보다 많습니다.</b>
          모르는 것이 아는 것보다 많은 상태이며, 확인 전에는 제안서에 인용하지 않습니다.</p>
      </Call>

      {d.narrative?.executive_summary && (
        <details style={{marginBottom:'1.2rem'}}>
          <summary>1차 조사 총평 — 왜 이 채널들인가</summary>
          <div className="body prose">{d.narrative.executive_summary}</div>
        </details>
      )}

      <Call tone="crit" label="설계를 지배하는 발견 3가지">

/* ─────────────── 키워드 네트워크 (3D) ───────────────
   실측 매칭 데이터(gate_results)의 동시출현 그래프를 3D 로 그린다.
   외부 라이브러리 없이 캔버스에 직접 그린다 — three.js 를 들이면 오너가
   내부를 읽을 수 없게 된다(NFR-02). 힘-방향 배치와 회전 투영은 아래
   200줄이 전부고, 각 단계에 왜가 적혀 있다. */

const KN_COLORS = {
  dark:  {primary:'#4ade80', secondary:'#60a5fa', facility:'#c084fc',
          target:'#fbbf24', exclude:'#f87171', region:'#22d3ee',
          edge:'rgba(148,163,184,', label:'#e2e8f0', dim:'rgba(148,163,184,.35)'},
  light: {primary:'#15803d', secondary:'#1d4ed8', facility:'#7e22ce',
          target:'#b45309', exclude:'#b91c1c', region:'#0e7490',
          edge:'rgba(71,85,105,', label:'#1e293b', dim:'rgba(100,116,139,.4)'},
};
const KN_CAT_KO = {primary:'1차', secondary:'2차', facility:'시설',
                   target:'대상', exclude:'제외어', region:'지역',
                   field:'분야', biztype:'유형', support:'지원형태'};
// 범용 축 색 — 도메인 팔레트를 재사용한다 (분야=초록, 유형=파랑, 형태=주황)
for (const t of ['dark', 'light']) {
  KN_COLORS[t].field = KN_COLORS[t].primary;
  KN_COLORS[t].biztype = KN_COLORS[t].secondary;
  KN_COLORS[t].support = KN_COLORS[t].target;
}

/* ── 구체 질감 ──
   평면 원 대신, 왼쪽 위 광원을 가정한 라디얼 그라디언트 구를 그린다.
   매 프레임 그라디언트를 만들면 느리므로 **색깔당 한 번** 큰 구를 그려
   캐시하고, 그릴 때 배율만 바꾼다 — 그라디언트는 축소해도 질감이 산다. */
const KN_SPRITES = new Map();
const KN_R0 = 40, KN_PAD = 20;                   // 원판 반지름 · 광택 여유
function knSphereSprite(color) {
  let sp = KN_SPRITES.get(color);
  if (sp) return sp;
  const S = (KN_R0 + KN_PAD) * 2;
  const c = document.createElement('canvas');
  c.width = c.height = S;
  const x = c.getContext('2d');
  const m = /^#(..)(..)(..)$/.exec(color) || [];
  const R = parseInt(m[1] || '96', 16), G = parseInt(m[2] || '96', 16),
        B = parseInt(m[3] || '96', 16);
  const mix = (k) => 'rgb(' + Math.max(0, Math.min(255, R + k)) + ','
    + Math.max(0, Math.min(255, G + k)) + ',' + Math.max(0, Math.min(255, B + k)) + ')';
  const cx = S / 2, cy = S / 2, r = KN_R0;
  // 본체 — 광원 쪽이 밝고 가장자리로 갈수록 어둡다
  const g = x.createRadialGradient(cx - r * 0.38, cy - r * 0.42, r * 0.06,
                                   cx, cy, r * 1.02);
  g.addColorStop(0, mix(95)); g.addColorStop(0.3, mix(30));
  g.addColorStop(0.72, mix(0)); g.addColorStop(1, mix(-80));
  x.fillStyle = g;
  x.beginPath(); x.arc(cx, cy, r, 0, Math.PI * 2); x.fill();
  // 표면 광택점 — 이게 있어야 '구'로 읽힌다
  const hi = x.createRadialGradient(cx - r * 0.42, cy - r * 0.5, 0,
                                    cx - r * 0.42, cy - r * 0.5, r * 0.5);
  hi.addColorStop(0, 'rgba(255,255,255,.75)');
  hi.addColorStop(1, 'rgba(255,255,255,0)');

          ctx.font = f2.font;
          ctx.fillText(f2.text, hubPos[k].x, hubPos[k].y + f1.size);

    const wake = () => { if (!document.hidden) raf = requestAnimationFrame(frame); };

      }

    if (!s.proj) return '';

    s.proj.forEach((p, i) => {

    const s = sim.current; if (!s) return;
    const rect = e.currentTarget.getBoundingClientRect();
    if (s.S.drag) {
      const dx = e.clientX - s.S.drag.x, dy = e.clientY - s.S.drag.y;
      s.S.ay += dx * 0.005; s.S.ax += dy * 0.005;
      s.S.moved += Math.abs(dx) + Math.abs(dy);
      s.S.drag = {x: e.clientX, y: e.clientY};
    } else {
      s.S.hover = (sim.current.idx || {})[pick(e.clientX - rect.left, e.clientY - rect.top)];
      if (s.S.hover === undefined) s.S.hover = -1;
    }
  };
  const onUp = (e) => {
    const s = sim.current; if (!s) return;
    const rect = e.currentTarget.getBoundingClientRect();
    if (s.S.moved < 6) {                          // 끌지 않았다 → 선택
      const id = pick(e.clientX - rect.left, e.clientY - rect.top);
      setSel((cur) => (id === cur ? '' : id));
    }
    s.S.drag = null;
  };
  const onWheel = (e) => {
    const s = sim.current; if (!s) return;
    e.preventDefault();
    s.S.zoom = Math.max(0.4, Math.min(3, s.S.zoom * (e.deltaY < 0 ? 1.1 : 0.9)));
  };

  if (err) return (
    <div className="panel" style={{marginBottom: '1rem'}}>
      <p className="empty-h">키워드 네트워크</p>
      <p className="small">⚠️ {err}</p>
    </div>
  );

  const key = fc && (fc.found ? fc.id : fc.q);
  return (
    <div style={{marginBottom: '1.2rem'}}>
      <div className="knGrid">
        <div className="panel knCanvasBox">
          <div className="small" style={{display:'flex',justifyContent:'space-between',flexWrap:'wrap',gap:6}}>
            <b>키워드 네트워크 — 공고 {g ? g.notices.toLocaleString() : '…'}건 실측</b>
            <span style={{color:'var(--muted)'}}>끌면 회전 · 휠 확대 · 구슬을 누르면 상세</span>
          </div>
          <canvas ref={cv} className="knCanvas"
            onPointerDown={onDown} onPointerMove={onMove} onPointerUp={onUp}
            onWheel={onWheel} />
          <div className="knLegend small">
            {(mode === 'general'
              ? ['field','biztype','support','region']
              : ['primary','secondary','facility','target','exclude','region']).map((c) => (
              <span key={c}><i style={{background:
                KN_COLORS[document.documentElement.getAttribute('data-theme')==='light'?'light':'dark'][c]}} />
                {KN_CAT_KO[c]}</span>
            ))}
            <span style={{color:'var(--muted)'}}>구슬 크기 = 매칭 공고 수</span>
          </div>
        </div>

        <div className="panel knSide">
          {!fc && !fcBusy ? (
            <Fragment>
              <p className="empty-h">키워드를 고르세요</p>
              <p className="small">위 검색창에 입력하거나, 그래프의 구슬을 누르면
                <b> 매칭 공고 수·함께 나온 키워드·월별 추세·RAG 원문 해설</b>이 여기 나옵니다.</p>
            </Fragment>
          ) : fcBusy ? (
            <p className="small">⏳ 분석 중… (RAG 검색 포함)</p>
          ) : fc.multi ? (
            <Fragment>
              <h3 style={{marginBottom: 6}}>복수 키워드 {fc.terms.length}개</h3>
              {fc.terms.map((t) => (
                <div key={t.term} style={{marginBottom: 10, paddingBottom: 8,
                     borderBottom: '1px dashed var(--rule)'}}>
                  <b>{t.term}</b>{' '}
                  {t.found ? (
                    <Fragment>
                      <span className="small">
                        {t.id !== t.term ? <Fragment>→ <b>{t.id}</b> · </Fragment> : '· '}
                        공고 <b>{t.n}건</b> · 통과 {t.passed}건</span>
                      <div className="chips" style={{marginTop: 4}}>
                        {t.neighbors.slice(0, 5).map((x) => (
                          <button key={x.id} type="button" className="pill"
                            title={'함께 나온 공고 ' + x.w + '건'}
                            onClick={() => setSel(x.id)}>{x.id} ×{x.w}</button>
                        ))}
                      </div>
                    </Fragment>
                  ) : (
                    <Fragment>
                      <span className="small" style={{color: 'var(--muted)'}}>공고 0건</span>
                      {(t.related || []).length ? (
                        <div className="chips" style={{marginTop: 4}}>
                          {t.related.slice(0, 5).map((m) => (
                            <button key={m.id} type="button" className="pill"
                              onClick={() => setSel(m.id)}>{m.id} · {m.n || 0}건</button>
                          ))}
                        </div>
                      ) : <span className="small"> · 사전 연관어 없음</span>}
                    </Fragment>
                  )}
                </div>
              ))}
              <p className="small" style={{color: 'var(--muted)'}}>
                🟡 별자리의 <b>금색 실선</b>은 두 검색어를 모두 잇는 다리 개념입니다.</p>
            </Fragment>
          ) : fc.found ? (
            <Fragment>
              <h3 style={{marginBottom:4}}>{fc.id}
                <Chip k={{primary:'ok',exclude:'crit',facility:'info',target:'info'}[fc.cat]||''}>
                  {KN_CAT_KO[fc.cat] || fc.cat}</Chip></h3>
              <p className="small" style={{marginBottom:8}}>
                공고 <b>{fc.n}건</b> 매칭 · 게이트 통과 <b>{fc.passed}건</b></p>
              {fc.neighbors.length ? (
                <Fragment>
                  <div className="small" style={{fontWeight:600,margin:'6px 0 4px'}}>함께 나온 키워드</div>
                  {fc.neighbors.slice(0,8).map((x) => (
                    <div key={x.id} className="knBar" onClick={() => setSel(x.id)}>
                      <span className="knBarName">{x.id}</span>
                      <span className="knBarTrack"><i style={{width:
                        Math.max(6, 100 * x.w / fc.neighbors[0].w) + '%'}} /></span>
                      <span className="mono small">{x.w}</span>
                    </div>
                  ))}
                </Fragment>
              ) : <p className="small">단독으로만 나타났습니다 — 함께 맞은 키워드가 없습니다.</p>}
              {fc.trend.length ? (
                <Fragment>
                  <div className="small" style={{fontWeight:600,margin:'10px 0 4px'}}>월별 추세 (마감월 기준)</div>
                  <div className="knTrend">
                    {fc.trend.map(([ym, n]) => (
                      <div key={ym} title={ym + ' · ' + n + '건'}>
                        <i style={{height: Math.max(8, 64 * n /
                          Math.max(...fc.trend.map((t) => t[1]))) + 'px'}} />
                        <span>{ym.slice(5)}</span>
                      </div>
                    ))}
                  </div>
                </Fragment>
              ) : null}
            </Fragment>
          ) : (
            <Fragment>
              <p className="empty-h">"{fc.q}" — 수집 공고에서 매칭 0건</p>
              <p className="small">1,835건의 실제 공고 어느 것도 이 말로 잡히지 않았습니다.
                <b> ADR-009 의 발견 그대로입니다</b> — 공고는 "웰니스관광"·"숲처방" 같은
                상위 프레임으로 나옵니다. 아래 RAG 해설에서 이 키워드가 실제로 어떤
                맥락에 사는지 보십시오.</p>
              {fc.related && fc.related.length ? (
                <Fragment>
                  <div className="small" style={{fontWeight:600,margin:'8px 0 4px'}}>사전 연관어</div>
                  <div className="chips">
                    {fc.related.map((m) => (
                      <button key={m.id} type="button" className="pill"
                        onClick={() => setSel(m.id)}>{m.id} · {m.n || 0}건</button>
                    ))}
                  </div>
                </Fragment>
              ) : null}
            </Fragment>
          )}
          {fc && fc.rag ? (
            <div style={{marginTop:12}}>
              <div className="small" style={{fontWeight:600,marginBottom:4}}>
                RAG 원문 해설 {fc.rag.ok ? '' : '— ' + fc.rag.why}</div>
              {fc.rag.hits.map((h, i) => (
                <div key={i} className="knRag">
                  <div className="small"><Chip k="info">{h.doc_type}</Chip> <b>{h.title}</b>
                    <span className="mono" style={{marginLeft:6,color:'var(--muted)'}}>{h.score}</span></div>
                  <blockquote className="small">{h.content}</blockquote>
                </div>
              ))}
              {fc.rag.ok && !fc.rag.hits.length ? (
                <p className="small">관련 원문이 없습니다.</p>) : null}
              <p className="small" style={{color:'var(--muted)',marginTop:6}}>
                해설은 생성문이 아니라 <b>색인된 원문 인용</b>입니다 — 근거 없는 문장을
                만들지 않습니다 (작업 규칙 1).</p>
            </div>
          ) : null}
        </div>
      </div>
    </div>
  );
}

/* ─────────────── New 데이터수집 ───────────────
   버튼 하나로 수집→본문→중복→게이트→의미대기열→RAG→화면 재생성을 돌린다.
   순서는 채널확대 작업에서 확립된 것(docs/채널확대_완료보고_20260831.md). */

function RefreshPanel({onClose}) {
  const [st, setSt] = useState({state: 'idle'});
  const run = () => {
    setSt({state: 'run', msg: '시작하는 중…', step: 0});
    fetch(API + '/api/refresh', {method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: '{}'})
      .then((r) => r.json()).then((d) => {
        if (d.error) { setSt({state: 'err', msg: d.error}); return; }
        if (d.already) setSt({state: 'run', msg: '이미 진행 중인 수집에 합류합니다…', step: 0});
        let miss = 0;
        const poll = () => fetch(API + '/api/jobs?id=' + d.job).then((r) => r.json())
          .then((j) => {
            if (!j.id && j.error) {
              setSt({state: 'err', msg: '작업 기록이 사라졌습니다 (서버 재시작?).'});
              return;
            }
            miss = 0;
            if (!j.done) {
              setSt({state: 'run', msg: j.current, step: j.step || 0,
                     steps: j.steps || 7});
              setTimeout(poll, 2500); return;
            }
            setSt({state: j.ok ? 'ok' : 'warn', lines: j.lines || [],
                   sec: j.total_sec, msg: j.current});
          }).catch(() => {
            if (++miss <= 6) { setTimeout(poll, 3000); return; }
            setSt({state: 'err', msg: '서버 응답이 끊겼습니다.'});
          });
        setTimeout(poll, 1500);
      }).catch((e) => setSt({state: 'err', msg: e.message}));
  };

  return (
    <div className="aiDrawer" style={{width: 'min(480px, calc(100vw - 36px))'}}>
      <div className="aiHead">
        <b>🔄 New 데이터수집</b>
        <span style={{flex: 1}} />
        <button className="btn sm" onClick={onClose} aria-label="닫기">✕</button>
      </div>
      {st.state === 'idle' ? (
        <Fragment>
          <p className="small">14개 채널에서 새 공고를 수집하고, 본문을 채우고, 중복을
            표시하고, 키워드 게이트와 의미 검토 대기열을 갱신하고, RAG 벡터DB 와
            화면 숫자까지 <b>오늘 기준으로</b> 맞춥니다.</p>
          <p className="small" style={{color: 'var(--muted)'}}>
            7단계 · 보통 5~10분 · robots.txt 허용 채널만 · 원본은 지우지 않습니다.
            도중에 이 창을 닫아도 계속 돌아갑니다.</p>
          <button className="btn pri" onClick={run}>지금 수집 시작</button>
        </Fragment>
      ) : st.state === 'run' ? (
        <Fragment>
          <div className="small" style={{marginBottom: 6}}>
            ⏳ {st.msg}</div>
          <div className="rfBar"><i style={{width:
            Math.max(4, 100 * (st.step || 0) / (st.steps || 7)) + '%'}} /></div>
          <p className="small" style={{color: 'var(--muted)', marginTop: 6}}>
            {st.step || 0}/{st.steps || 7} 단계 — 창을 닫아도 계속 진행됩니다.</p>
        </Fragment>
      ) : st.state === 'err' ? (
        <Fragment>
          <p className="small" style={{color: 'var(--critical)'}}>⚠️ {st.msg}</p>
          <button className="btn" onClick={run}>다시 시도</button>
        </Fragment>
      ) : (
        <Fragment>
          <div className="small" style={{marginBottom: 6}}>
            {st.state === 'ok' ? '✅ 완료' : '⚠️ 일부 단계 실패'} · {st.sec}초</div>
          <pre className="md-pre" style={{fontSize: '.78rem'}}>{(st.lines || []).join(String.fromCharCode(10))}</pre>
          <div className="controls" style={{marginTop: 8}}>
            <button className="btn pri" onClick={() => location.reload()}>
              새 데이터로 화면 새로고침</button>
            <button className="btn" onClick={run}>다시 실행</button>
          </div>
        </Fragment>
      )}
    </div>
  );
}

/* ─────────────── AI 설정 ───────────────
   🔒 키는 이 화면에서 서버로 한 번 가고, 로컬 파일에만 남는다.
   화면은 언제나 마스킹만 받는다 — 원문을 다시 읽어올 방법이 없다. */

const TIER_KO = {basic: '보급형', standard: '표준', top: '최상위'};

function AISetup() {
  const [cfg, setCfg] = useState(null);
  const [draft, setDraft] = useState({});
  const [msg, setMsg] = useState('');
  // 제공사별 연결 테스트 결과 — 키가 문제인지 모델명이 문제인지 나눠 보여준다
  const [test, setTest] = useState({});
  const load = () => fetch(API + '/api/ai/config').then((r) => r.json())
    .then(setCfg)
    .catch(() => setMsg('서버가 꺼져 있습니다 — 바탕화면 아이콘으로 실행하십시오.'));

  const runTest = (pid, key) => {
    setTest((t) => ({...t, [pid]: {state: 'run'}}));
    fetch(API + '/api/ai/test', {method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(key ? {provider: pid, key} : {provider: pid})})
      .then((r) => r.json())
      .then((r) => setTest((t) => ({...t, [pid]: {state: 'done', ...r}})))
      .catch((e) => setTest((t) => ({...t, [pid]:
        {state: 'done', error: e.message}})));
  };
  useEffect(() => { load(); }, []);

  const post = (payload, okMsg) => {
    setMsg('처리 중…');
    fetch(API + '/api/ai/key', {method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)})
      .then((r) => r.json()).then((r) => {
        setMsg(r.error ? '⚠️ ' + r.error : '✅ ' + okMsg);
        setDraft({}); load();
        // 저장·모델변경 직후 바로 확인 — 「넣었는데 되나?」를 묻지 않게 한다
        if (!r.error && payload.provider && payload.action !== 'delete') {
          runTest(payload.provider);
        }
      }).catch((e) => setMsg('⚠️ ' + e.message));
  };

  if (!cfg) return (
    <Fragment>
      <h2 className="sec-title">AI 설정</h2>
      <p className="small">{msg || '불러오는 중…'}</p>
    </Fragment>
  );

  return (
    <Fragment>
      <h2 className="sec-title">AI 설정 — 내 API 키로 전략 제안 받기</h2>
      <p className="sec-desc">키워드 검색 결과(실측 공고 데이터 + RAG 근거)를 AI에게 보내
        <b> 사업 아이디어·근거 문장</b>을 받습니다. <b>키는 지도사님 것을 쓰고 비용도
        지도사님 부담</b>입니다 — 중개하는 서버가 없기 때문입니다.</p>

      <Call tone="warn" label="키는 이 컴퓨터에만 저장됩니다">
        <p>입력한 키는 <span className="mono">config\ai_keys.json</span> 파일 하나에만
          저장되고, 화면에는 다시 <b>마스킹된 형태만</b> 표시됩니다. 이 파일은 깃 커밋과
          배포 ZIP 양쪽에서 자동으로 차단됩니다. <b>누구에게도 보내지 마십시오.</b></p>
      </Call>

      {cfg.providers.map((pv) => (
        <div className="panel" key={pv.id} style={{marginBottom: '.9rem'}}>
          <h3>{pv.label}{' '}
            {pv.has_key ? <Chip k="ok">등록됨 {pv.masked}</Chip> : <Chip>미등록</Chip>}
            {cfg.active === pv.id ? <Chip k="info">사용 중</Chip> : null}
          </h3>
          <p className="small" style={{marginBottom: 8}}>
            키 발급 →{' '}
            <a href={pv.key_url} target="_blank" rel="noopener noreferrer">{pv.key_url}</a>
            {' '}(키는 <span className="mono">{pv.key_hint}</span> 로 시작합니다)
          </p>

          <div className="controls">
            <input type="password" className="btn" style={{flex: '1 1 240px'}}
              placeholder={pv.has_key ? '새 키로 교체하려면 붙여넣기' : '여기에 API 키 붙여넣기'}
              value={draft[pv.id] || ''} autoComplete="off"
              onChange={(e) => setDraft({...draft, [pv.id]: e.target.value})} />
            <select className="btn" value={pv.model} aria-label={pv.label + ' 모델'}
              onChange={(e) => post({action: 'model', provider: pv.id,
                                     model: e.target.value}, '모델을 바꿨습니다')}>
              {!pv.models.some((m) => m.id === pv.model) ? (
                <option value={pv.model}>[직접] {pv.model}</option>
              ) : null}
              {pv.models.map((m) => (
                <option key={m.id} value={m.id}>[{TIER_KO[m.tier]}] {m.label}</option>
              ))}
            </select>
            <button className="btn pri" disabled={!(draft[pv.id] || '').trim()}
              onClick={() => post({provider: pv.id, key: draft[pv.id],
                                   model: pv.model}, '키를 저장했습니다')}>저장</button>
            {pv.has_key ? (
              <Fragment>
                <button className="btn" onClick={() => runTest(pv.id)}
                  title="키가 실제로 쓸 수 있는지 확인합니다 (토큰 비용 없음)">
                  연결 테스트</button>
                {cfg.active !== pv.id ? (
                  <button className="btn" onClick={() => post(
                    {action: 'active', provider: pv.id},
                    '이 제공사를 쓰도록 바꿨습니다')}>이걸로 사용</button>
                ) : null}
                <button className="btn" onClick={() => {
                  if (window.confirm(pv.label + ' 키를 지웁니다. 계속할까요?'))
                    post({action: 'delete', provider: pv.id}, '키를 삭제했습니다');
                }}>키 삭제</button>
              </Fragment>
            ) : null}
          </div>
          <div className="small" style={{color: 'var(--muted)'}}>
            보급형은 빠르고 싸며, 최상위는 느리지만 추론이 깊습니다.
            처음에는 <b>보급형</b>으로 충분합니다.
            현재 모델: <span className="mono">{pv.model}</span>
          </div>
          {test[pv.id] ? (() => {
            const t = test[pv.id];
            if (t.state === 'run') return (
              <p className="small" style={{marginTop: 6}}>⏳ 확인 중… (토큰 비용 없음)</p>);
            if (t.error && t.key_ok === undefined) return (
              <p className="small" style={{marginTop: 6, color: 'var(--critical)'}}>
                ⚠️ {t.error}</p>);
            return (
              <div className="panel" style={{marginTop: 8, padding: '8px 12px',
                   borderColor: t.ok ? 'var(--accent)' : 'var(--critical)'}}>
                <div className="small">
                  <b>{t.key_ok ? '🔑 키 유효' : '🔑 키 사용 불가'}</b>
                  {t.key_ok ? (
                    <Fragment>
                      {' · '}모델 <span className="mono">{t.model}</span>{' '}
                      {t.model_ok ? '✅ 있음' : '❌ 이 키로는 없음'}
                      {/* 목록에 있어도 한도 초과면 실제로는 못 쓴다 — 따로 표시 */}
                      {t.model_ok ? (
                        <Fragment>{' · '}실제 호출{' '}
                          {t.gen_ok === false ? '❌ 거부됨' : '✅ 성공'}</Fragment>
                      ) : null}
                      {t.ms ? <span style={{color: 'var(--muted)'}}> · {t.ms}ms</span> : null}
                    </Fragment>
                  ) : (t.code ? ' · HTTP ' + t.code : '')}
                </div>
                {t.detail ? (
                  <div className="small" style={{marginTop: 4, wordBreak: 'break-word'}}>
                    {t.detail}</div>
                ) : null}
                {t.hint ? (
                  <div className="small" style={{marginTop: 4}}>
                    <Markdown text={'👉 ' + t.hint} /></div>
                ) : null}
                {t.key_ok && !t.model_ok && (t.usable || []).length ? (
                  <div style={{marginTop: 6}}>
                    <div className="small" style={{fontWeight: 600, marginBottom: 4}}>
                      이 키로 쓸 수 있는 모델 {t.usable.length}개 — 눌러서 적용</div>
                    <div className="chips">
                      {t.usable.slice(0, 24).map((mid) => (
                        <button key={mid} type="button" className="pill"
                          onClick={() => post({action: 'model', provider: pv.id,
                                               model: mid}, '모델을 ' + mid + ' 로 바꿨습니다')}>
                          {mid}</button>
                      ))}
                    </div>
                  </div>
                ) : null}
              </div>
            );
          })() : null}
          {pv.has_key ? (
            <details style={{marginTop: 6}}>
              <summary className="small">모델 직접 입력 — 목록에 없는 최신 모델을 쓸 때</summary>
              <div className="controls" style={{marginTop: 6}}>
                <input type="text" className="btn" style={{flex: '1 1 200px'}}
                  placeholder="모델 ID 그대로 (예: gpt-5.7, gemini-3.2-pro)"
                  value={draft['m_' + pv.id] || ''}
                  onChange={(e) => setDraft({...draft, ['m_' + pv.id]: e.target.value})} />
                <button className="btn" disabled={!(draft['m_' + pv.id] || '').trim()}
                  onClick={() => post({action: 'model', provider: pv.id,
                                       model: (draft['m_' + pv.id] || '').trim()},
                                      '모델을 직접 지정했습니다')}>적용</button>
              </div>
              <p className="small" style={{color: 'var(--muted)'}}>
                모델명이 틀리면 답변 시 오류로 알려 줍니다 — 제공사 문서의 ID 를 그대로 쓰세요.</p>
            </details>
          ) : null}
        </div>
      ))}
      {msg ? <p className="small"><b>{msg}</b></p> : null}
      <p className="small" style={{color: 'var(--muted)'}}>
        저장 위치: <span className="mono">{cfg.path}</span>
      </p>
    </Fragment>
  );
}

/* ─────────────── 전역 AI 챗봇 ───────────────
   어느 메뉴에서 열든 ① 그 메뉴의 **실데이터 요약**과 ② 질문에 맞는 RAG 원문을
   서버가 함께 붙여 보낸다. 숫자의 정답은 언제나 이 요약 쪽 — 모델 기억이 아니다.
   대화 이력은 App 이 들고 있어 탭을 옮겨도 이어진다(종·횡 연계). */

function tabContext(tab, d, live) {
  if (!d) return '';
  const row = (o, ks) => ks.map((k) => o[k]).filter(Boolean).join(' · ');
  try {
    switch (tab) {
      case 'priority':
        return '우선순위 채널 ' + d.priority_channels.length + '곳 (점수순):\n'
          + d.priority_channels.map((c, i) =>
              (i + 1) + '. ' + row(c, ['name', 'org', 'why']) ).join('\n');
      case 'channels': {
        const by = {};
        d.channels.forEach((c) => { by[c.access || c.type || '?'] =
          (by[c.access || c.type || '?'] || 0) + 1; });
        return '수집 채널 ' + d.channels.length + '곳. 접근방식 분포: '
          + Object.entries(by).map(([k, v]) => k + ' ' + v).join(', ')
          + '\n상위 20곳: ' + d.channels.slice(0, 20).map((c) => c.name).join(', ');
      }
      case 'programs':
        return '유사사업 사례 ' + d.programs.length + '건. 처음 15건:\n'
          + d.programs.slice(0, 15).map((p) =>
              '- ' + row(p, ['name', 'agency', 'budget', 'target'])).join('\n');
      case 'datasets':
        return '공공데이터셋 ' + d.datasets.length + '개. 처음 15개:\n'
          + d.datasets.slice(0, 15).map((x) =>
              '- ' + row(x, ['name', 'org', 'format'])).join('\n');
      case 'keywords': {
        if (window.CHOI_KWMODE === 'general') {
          const kg = d.keywords_general || {};
          return '키워드 탭 — 🌐 범용 지원사업 모드. '
            + Object.entries(kg).map(([k, a]) => k + ' ' + a.length + '개').join(', ')
            + String.fromCharCode(10) + '분야 예: ' + (kg.field || []).slice(0, 14).join(', ')
            + String.fromCharCode(10) + '네트워크는 공고 전체(중복 제외)를 분야·사업유형·지원형태 축으로'
            + ' 실시간 매칭한 것입니다. 범용(전 분야) 사업계획서 전략 질문에 이 축으로 답하십시오.';
        }
        const ks = Object.entries(d.keywords)
          .map(([k, a]) => k + ' ' + a.length + '개').join(', ');
        return '키워드 사전: ' + ks
          + '\n1차 예: ' + d.keywords.primary.slice(0, 12).join(', ')
          + '\n대상 축(연령·성별·계층 포함): ' + d.keywords.target.slice(0, 20).join(', ')
          + '\n키워드 탭의 3D 네트워크는 공고 1,835건 실측 동시출현 + 지역 축을 보여줍니다.';
      }
      case 'market': {
        const n = d.narrative || {};
        let s = Object.entries(n).map(([k, v]) =>
          typeof v === 'string' ? k + ': ' + v.slice(0, 200) : '').filter(Boolean).join('\n');
        if (live && live.kpi_cards) {
          s += '\n정량 KPI: ' + live.kpi_cards.slice(0, 8).map((c) =>
            c.label + ' ' + c.value + (c.delta ? '(' + c.delta + ')' : '')).join(' · ');
        }
        return s;
      }
      case 'risks':
        return '라이선스 경고 ' + d.license_warnings.length + '건: '
          + d.license_warnings.slice(0, 6).map((w) => w.name || w.channel || '').join(', ')
          + '\n미결정 ' + d.open_questions.length + '건: '
          + d.open_questions.slice(0, 6).map((q) => (q.q || q.question || '').slice(0, 60)).join(' / ');
      case 'roadmap':
        return '수집 단계 ' + (d.collection_steps || []).length + ' · 인제스트 단계 '
          + (d.ingest_steps || []).length + ' · PMS 모델 항목 ' + (d.pms_model || []).length;
      case 'prepare':
        return ['사업계획서 탭 = 작성 파이프라인.',
          '1단계 공고 선택(수집 목록 or 직접 받은 공고문) → [작성 폴더 만들기]',
          '2단계 공고문·지정서식 업로드 → 배점표 자동 추출',
          '3단계 오너 자료 업로드 → RAG 자동 색인',
          '이후 Claude 터미널에서 "사업계획서 써줘" (G1자격→G2인터뷰→G3배점→G4근거→G5형식)',
          '품질 검사: python -m choi review --notice-id <번호> 또는 --folder .'].join('\n');
      case 'overview':
        return '조사 기준일 ' + d.generated_at + ' · 채널 ' + d.channels.length
          + ' · 공고사례 ' + d.programs.length + ' · 데이터셋 ' + d.datasets.length
          + ' · 키워드 ' + Object.values(d.keywords).flat().length;
      default:
        return '';
    }
  } catch (e) {
    return '';
  }
}

const TAB_LABEL = {prepare: '사업계획서', overview: '개요', market: '시장·시설자금',
  priority: '우선순위', channels: '채널', programs: '공고 사례',
  datasets: '공공데이터', keywords: '키워드', roadmap: '로드맵',
  risks: '리스크', guide: '사용법', ai: 'AI 설정'};

const CHAT_CHIPS = [
  {label: '이 메뉴는 뭘 보여주나요?', q: '지금 보고 있는 메뉴가 무엇을 보여주고, 사업계획서 작성에 어떻게 쓰는지 알려주세요.'},
  {label: '✨ 사업 아이디어 3개', q: '이 데이터를 근거로 최은희 지도사에게 맞는 사업 아이디어 3개를 제안해 주세요. 각각 대상·차별점·예상 발주처와 근거 번호를 붙여 주세요.'},
  {label: '근거 수치 찾기', q: '제안서에 인용할 수 있는 근거 수치를 RAG 에서 찾아 출처와 함께 알려주세요.'},
  {label: '다음에 뭘 하죠?', q: '지금 단계에서 다음으로 무엇을 하면 되는지 사용법을 알려주세요.'},
];

function AIChat({tab, data, live, msgs, setMsgs, onClose}) {
  const [inp, setInp] = useState('');
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState('');
  // 실패한 질문 — 다시 치게 하지 않고 버튼 한 번으로 재요청한다
  const [lastQ, setLastQ] = useState('');
  // ── 창처럼 다루기 ──
  // pos=null 이면 기본 자리(오른쪽 아래). 옮기면 좌표를 기억한다.
  // 자리와 접힘 상태는 localStorage 에 남긴다 — 새로고침해도 그대로.
  // (사생활 모드에선 던지므로 반드시 감싼다)
  const [pos, setPos] = useState(() => {
    try {
      const v = JSON.parse(localStorage.getItem('choi-ai-pos') || 'null');
      return (v && typeof v.x === 'number') ? v : null;
    } catch (e) { return null; }
  });
  const [mini, setMini] = useState(false);
  const boxRef = React.useRef(null);
  const dragRef = React.useRef(null);

  const clamp = (x, y, w, h) => ({
    x: Math.max(6, Math.min(x, window.innerWidth - Math.max(160, w) - 6)),
    y: Math.max(6, Math.min(y, window.innerHeight - 48)),
  });

  const savePos = (v) => {
    setPos(v);
    try { localStorage.setItem('choi-ai-pos', JSON.stringify(v)); } catch (e) {}
  };

  const onHeadDown = (e) => {
    // 버튼을 누른 것이면 드래그가 아니다
    if (e.target.closest('button, select, input')) return;
    const box = boxRef.current; if (!box) return;
    const r = box.getBoundingClientRect();
    dragRef.current = {dx: e.clientX - r.left, dy: e.clientY - r.top,
                       w: r.width, h: r.height};
    e.currentTarget.setPointerCapture(e.pointerId);
  };
  const onHeadMove = (e) => {
    const d = dragRef.current; if (!d) return;
    savePos(clamp(e.clientX - d.dx, e.clientY - d.dy, d.w, d.h));
  };
  const onHeadUp = () => { dragRef.current = null; };

  // 창 크기가 바뀌면 화면 밖으로 나간 서랍을 되돌린다
  useEffect(() => {
    const fix = () => {
      if (!pos || !boxRef.current) return;
      const r = boxRef.current.getBoundingClientRect();
      const c = clamp(pos.x, pos.y, r.width, r.height);
      if (c.x !== pos.x || c.y !== pos.y) savePos(c);
    };
    window.addEventListener('resize', fix);
    return () => window.removeEventListener('resize', fix);
  }, [pos]);

  const style = pos
    ? {left: pos.x + 'px', top: pos.y + 'px', right: 'auto', bottom: 'auto'}
    : {};
  // 어떤 AI 가 답하는지 **묻기 전에** 보이고, 여기서 바로 바꿀 수 있어야 한다
  const [cfg, setCfg] = useState(null);
  const [prov, setProv] = useState('');
  const [model, setModel] = useState('');
  // 웹검색은 **끈 상태가 기본**이다 — 켜면 제공사 검색 요금이 따로 붙는다.
  const [web, setWeb] = useState(false);
  const endRef = React.useRef(null);

  useEffect(() => {
    fetch(API + '/api/ai/config').then((r) => r.json()).then((c) => {
      setCfg(c);
      const ready = (c.providers || []).filter((x) => x.has_key);
      const cur = ready.find((x) => x.id === c.active) || ready[0];
      if (cur) { setProv(cur.id); setModel(cur.model); }
    }).catch(() => {});
  }, []);

  const provObj = cfg && prov
    ? (cfg.providers || []).find((x) => x.id === prov) : null;
  const ready = cfg ? (cfg.providers || []).filter((x) => x.has_key) : [];
  useEffect(() => {
    if (endRef.current) endRef.current.scrollIntoView({block: 'end'});
  }, [msgs, busy]);

  const ask = (text) => {
    const q = (text || '').trim();
    if (!q || busy) return;
    setErr(''); setInp(''); setLastQ(q);
    // 재요청이면 실패했던 같은 질문이 두 번 쌓이지 않게 한다
    const base = (msgs.length && msgs[msgs.length - 1].role === 'user'
                  && msgs[msgs.length - 1].content === q)
      ? msgs.slice(0, -1) : msgs;
    const next = [...base, {role: 'user', content: q, tab}];
    setMsgs(next); setBusy(true);
    fetch(API + '/api/ai/chat', {method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        tab, tab_context: tabContext(tab, data, live),
        provider: prov || undefined, model: model || undefined, web,
        kw_q: (tab === 'keywords' && window.CHOI_KWQ) || undefined,
        kw_mode: (tab === 'keywords' && window.CHOI_KWMODE) || undefined,
        messages: next.map((m) => ({role: m.role, content: m.content})),
      })})
      .then((r) => r.json()).then((d) => {
        if (d.error) { setBusy(false); setErr(d.error); return; }
        // 폴링은 오래 돈다(최상위 모델은 2분까지). 그 사이 한 번 끊겼다고
        // 대화를 죽이지 않는다 — 몇 번 더 두드려 보고 그래도 안 되면 알린다.
        let miss = 0;
        const poll = () => fetch(API + '/api/jobs?id=' + d.job).then((r) => r.json())
          .then((j) => {
            if (!j.id && j.error) {   // 404 — 그런 작업이 없다(서버 재시작 등)
              setBusy(false);
              setErr('작업 기록이 사라졌습니다 (서버 재시작?). 다시 보내 주세요.');
              return;
            }
            miss = 0;
            if (!j.done) { setTimeout(poll, 1500); return; }
            setBusy(false);
            if (!j.ok) {
              setErr((j.error || j.current || '실패')
                     + (j.hint ? ' — ' + j.hint.replace(/\*\*/g, '') : ''));
              return;
            }
            setMsgs((cur) => [...cur, {role: 'assistant', content: j.text,
                                       sources: j.sources || [],
                                       webCites: j.web_cites || [],
                                       webUsed: j.web_used, webNote: j.web_note,
                                       truncNote: j.trunc_note, webAsked: web,
                                       provider: j.provider, model: j.model}]);
          }).catch(() => {
            if (++miss <= 5) { setTimeout(poll, 2000); return; }
            setBusy(false);
            setErr('서버 응답이 끊겼습니다 — 바탕화면 아이콘으로 서버를 다시 띄워 보세요.');
          });
        setTimeout(poll, 1200);
      }).catch((e) => { setBusy(false); setErr(e.message); });
  };

  if (mini) {
    const last = [...msgs].reverse().find((m) => m.role === 'assistant');
    return (
      <div className="aiBar" onClick={() => setMini(false)}
        title="눌러서 다시 펼칩니다">
        <b>✨ AI 도우미</b>
        <span className="small" style={{flex: 1, overflow: 'hidden',
              textOverflow: 'ellipsis', whiteSpace: 'nowrap'}}>
          {busy ? '⏳ 답하는 중…'
                : last ? last.content.replace(/[#*|>]/g, ' ').slice(0, 60)
                       : '답변 없음 — 눌러서 질문하기'}
        </span>
        <button className="btn sm" aria-label="펼치기"
          onClick={(e) => { e.stopPropagation(); setMini(false); }}>▲ 펼치기</button>
        <button className="btn sm" aria-label="닫기"
          onClick={(e) => { e.stopPropagation(); onClose(); }}>✕</button>
      </div>
    );
  }

  return (
    <div className="aiDrawer" ref={boxRef} style={style}>
      <div className="aiHead aiDrag" onPointerDown={onHeadDown}
        onPointerMove={onHeadMove} onPointerUp={onHeadUp}
        title="여기를 끌어서 옮기십시오">
        <b>✨ AI 도우미</b>
        <span className="small" style={{color: 'var(--muted)'}}>
          지금 보는 곳: <b>{TAB_LABEL[tab] || tab}</b></span>
        <span style={{flex: 1}} />
        {msgs.length ? (
          <button className="btn sm" onClick={() => setMsgs([])}
            title="대화를 새로 시작합니다">새 대화</button>
        ) : null}
        <button className="btn sm" onClick={() => setMini(true)}
          aria-label="아래로 내리기" title="작업줄로 내립니다 (답변은 유지)">▼</button>
        {pos ? (
          <button className="btn sm" onClick={() => savePos(null)}
            aria-label="제자리로" title="원래 자리로 되돌립니다">⤢</button>
        ) : null}
        <button className="btn sm" onClick={onClose} aria-label="닫기">✕</button>
      </div>

      {cfg ? (
        ready.length ? (
          <div className="aiPick">
            <select className="btn" aria-label="AI 제공사" value={prov}
              onChange={(e) => {
                const pid = e.target.value;
                setProv(pid);
                const o = cfg.providers.find((x) => x.id === pid);
                setModel(o ? o.model : '');
              }}>
              {ready.map((x) => (
                <option key={x.id} value={x.id}>{x.label}</option>
              ))}
            </select>
            <button type="button" className={'btn webTgl' + (web ? ' on' : '')}
              aria-pressed={web} onClick={() => setWeb(!web)}
              title={web ? '웹검색 켜짐 — 최신 정보를 찾아 출처와 함께 답합니다 (검색 요금 별도)'
                         : '웹검색 꺼짐 — 내 데이터와 RAG 근거로만 답합니다'}>
              🌐 웹검색 {web ? 'ON' : 'OFF'}</button>
            <select className="btn" aria-label="모델" value={model}
              onChange={(e) => setModel(e.target.value)}>
              {provObj && !provObj.models.some((m) => m.id === model) && model ? (
                <option value={model}>[직접] {model}</option>
              ) : null}
              {(provObj ? provObj.models : []).map((m) => (
                <option key={m.id} value={m.id}>[{TIER_KO[m.tier]}] {m.label}</option>
              ))}
            </select>
          </div>
        ) : (
          <p className="small" style={{color: 'var(--critical)'}}>
            ⚠️ 등록된 AI 키가 없습니다 — 「AI 설정」 탭에서 키를 먼저 넣으십시오.</p>
        )
      ) : null}

      <div className="aiLog">
        {!msgs.length ? (
          <p className="small" style={{color: 'var(--muted)'}}>
            이 메뉴의 <b>실데이터</b>와 <b>RAG 원문 근거</b>를 함께 보고 답합니다.
            데이터 문의·사용법·사업 아이디어 무엇이든 물어보세요.
            (먼저 「AI 설정」 탭에서 키를 넣으셔야 합니다 — 비용은 지도사님 부담)
          </p>
        ) : null}
        {msgs.map((m, i) => (
          <div key={i} className={'aiMsg ' + m.role}>

function AIPropose({q, setQ, onClose}) {
  const [st, setSt] = useState({state: 'idle'});
  const [text, setText] = useState('');
  useEffect(() => { setSt({state: 'idle'}); setText(''); }, [q]);

  const run = () => {
    if (!q.trim()) return;
    setSt({state: 'run', msg: '시작하는 중…'});
    fetch(API + '/api/ai/propose', {method: 'POST',
      headers: {'Content-Type': 'application/json'}, body: JSON.stringify({q})})
      .then((r) => r.json()).then((d) => {
        if (d.error) { setSt({state: 'err', msg: d.error}); return; }
        let miss = 0;
        const poll = () => fetch(API + '/api/jobs?id=' + d.job).then((r) => r.json())
          .then((j) => {
            if (!j.id && j.error) {   // 404 — 그런 작업이 없다
              setSt({state: 'err', msg: '작업 기록이 사라졌습니다 (서버 재시작?).'});
              return;
            }
            miss = 0;
            if (!j.done) { setSt({state: 'run', msg: j.current}); setTimeout(poll, 2000); return; }
            if (!j.ok) {
              setSt({state: 'err', msg: (j.error || j.current)
                     + (j.hint ? ' — ' + j.hint.replace(/\*\*/g, '') : '')});
              return;
            }
            setText(j.text || '');
            setSt({state: 'ok', provider: j.provider, model: j.model,
                   sources: j.sources || [], net: j.net_summary || []});
          }).catch(() => {
            if (++miss <= 5) { setTimeout(poll, 2000); return; }
            setSt({state: 'err', msg: '서버 응답이 끊겼습니다 — 서버를 다시 띄워 보세요.'});
          });
        setTimeout(poll, 1200);
      }).catch((e) => setSt({state: 'err', msg: e.message}));
  };

  return (
    <div className="aiDrawer">
      <div className="aiHead">
        <b>✨ AI 사업 제안</b>
        <button className="btn sm" onClick={onClose} aria-label="AI 제안 닫기">✕</button>
      </div>
      <input type="search" className="btn" style={{width: '100%', marginBottom: 8}}
        placeholder="키워드 — 예: 명상 청년, 숲체험" value={q}
        onChange={(e) => setQ(e.target.value)}
        onKeyDown={(e) => { if (e.key === 'Enter') run(); }} />
      {st.state === 'idle' ? (
        <Fragment>
          <p className="small">이 키워드의 <b>실측 공고 데이터</b>와 <b>RAG 원문 근거</b>를
            함께 보내 사업 아이디어·근거 문장을 받습니다.</p>
          <button className="btn pri" disabled={!q.trim()} onClick={run}>제안 받기</button>
          <p className="small" style={{color: 'var(--muted)', marginTop: 6}}>
            「AI 설정」 탭에서 키를 먼저 넣으셔야 합니다. 비용은 지도사님 계정에 청구됩니다.</p>
        </Fragment>
      ) : st.state === 'run' ? (
        <p className="small">⏳ {st.msg}</p>
      ) : st.state === 'err' ? (
        <Fragment>
          <p className="small" style={{color: 'var(--critical)'}}>⚠️ {st.msg}</p>
          <button className="btn" onClick={run}>다시 시도</button>
        </Fragment>
      ) : (
        <Fragment>
          <div className="small" style={{color: 'var(--muted)', marginBottom: 6}}>
            {st.provider} · {st.model}</div>
          <div className="aiBody"><Markdown text={text} /></div>
          {st.sources.length ? (
            <details style={{marginTop: 10}}>
              <summary className="small">근거 원문 {st.sources.length}건 — AI 가 본 것 그대로</summary>
              {st.sources.map((h, i) => (
                <div key={i} className="knRag">
                  <div className="small"><b>[{i + 1}]</b>{' '}
                    <Chip k="info">{h.doc_type}</Chip> {h.title}</div>
                  <blockquote className="small">{h.content}</blockquote>
                </div>
              ))}
            </details>
          ) : null}
          <p className="small" style={{color: 'var(--muted)', marginTop: 8}}>
            ⚠️ AI 출력은 <b>초안</b>입니다. 수치·기관명은 반드시 원문과 대조하십시오.</p>
        </Fragment>
      )}
    </div>
  );
}


function Keywords({d}) {
  const [q, setQ] = useState('');
  // 도메인(명상·심리치유) / 범용 지원사업 — 분석 축 전환.
  // 게이트(발굴)는 언제나 도메인 사전을 쓴다. 이 토글은 **분석·AI 제안** 전용이다.
  const [kwMode, setKwMode] = useState('domain');
  useEffect(() => { window.CHOI_KWMODE = kwMode; }, [kwMode]);
  useEffect(() => { window.CHOI_KWQ = q; return () => { window.CHOI_KWQ = ''; }; }, [q]);

  // ── 칩 → 네트워크 연동 ──
  // 선택 상태의 정본은 검색창 q 하나다(쉼표 목록). 칩을 누르면 q 에
  // 넣고 빼며, 네트워크·별자리·RAG 는 q 를 보고 이미 움직인다.
  const activeKws = q.split(',').map((x) => x.trim()).filter(Boolean);
  const toggleKw = (w) => {
    const parts = [...activeKws];
    const i = parts.indexOf(w);
    if (i >= 0) parts.splice(i, 1);
    else {
      if (parts.length >= 4) parts.shift();   // 서버 분석 상한 4개 — 오래된 것부터 밀어냄
      parts.push(w);
    }
    setQ(parts.join(', '));
    // 결과는 위(네트워크)에 나타난다 — 화면 밖이면 데려간다
    const c = document.querySelector('.knCanvas');
    if (parts.length && c) {
      const r = c.getBoundingClientRect();
      if (r.top < 0 || r.top > window.innerHeight * 0.6) {
        c.scrollIntoView({block: 'center', behavior: 'smooth'});
      }
    }
  };
  // 칩을 고르는 중에는 사전 목록을 걸러내지 않는다 — 다음 칩을 계속
  // 골라야 하는데 목록이 줄어들면 고를 수가 없다(자유 입력만 필터로 쓴다)
  const chipFilter = activeKws.length ? '' : q.trim();
  const meta = {
    primary:   {label:'1차 — 하나만 맞아도 통과', tone:'ok'},
    secondary: {label:'2차 — 2개 조합 시 통과', tone:''},
    facility:  {label:'시설자금 트랙', tone:'info'},
    target:    {label:'대상 (청소년·기업·시니어)', tone:'info'},
    exclude:   {label:'제외어 — 오탐 방지', tone:'crit'},
    field:     {label:'지원 분야', tone:'ok'},
    biztype:   {label:'사업 유형', tone:''},
    support:   {label:'지원 형태', tone:'info'},
  };
  return (
    <Fragment>
      <h2 className="sec-title">키워드 사전 {Object.values(d.keywords).flat().length}개</h2>
      <p className="sec-desc">규칙 기반 1차 게이트에 쓰는 사전입니다. LLM을 쓰지 않아 비용이 0이고,
        <b> 왜 통과·탈락했는지 이 파일만 보면 알 수 있습니다.</b> 최은희 지도사가 직접 수정하는 파일입니다
        (<span className="mono">config/keywords.yaml</span>).</p>
      <Call tone="warn" label="설계 원칙 — ADR-009">
        <p>조사에서 <b>'명상'을 표제로 내건 국가 단위 지원사업은 0건</b>이었습니다.
          실제 공고는 "웰니스관광 운영 지원"(힐링·명상 테마 포함), "국민마음회복 숲처방"(숲명상 포함) 같은 이름으로 나옵니다.
          그래서 사전을 <b>상위 프레임 축</b>으로 구성했습니다 — '명상' 단독 매칭에 의존하면 아무것도 못 잡습니다.</p>
      </Call>
      <div className="srcTabs" role="tablist" style={{margin: '0 0 12px'}}>
        <button className="srcTab" role="tab" aria-selected={kwMode === 'domain'}
          onClick={() => setKwMode('domain')}>
          🧘 도메인 — 명상·심리치유
          <span>발굴 게이트가 쓰는 사전 · 통과 공고의 실측 매칭</span>
        </button>
        <button className="srcTab" role="tab" aria-selected={kwMode === 'general'}
          onClick={() => setKwMode('general')}>
          🌐 범용 지원사업
          <span>분야·사업유형·지원형태 — 전 분야 트렌드와 범용 사업계획서</span>
        </button>
      </div>
      {kwMode === 'general' ? (
        <p className="small" style={{margin: '0 0 10px', color: 'var(--muted)'}}>
          공고 전체(중복 제외)를 <b>분야·사업유형·지원형태</b> 축으로 봅니다.
          발굴 게이트에는 영향이 없습니다 — 사전은
          <span className="mono"> config\keywords_general.yaml</span> 을 고치면 됩니다.
        </p>
      ) : null}
      <div className="controls">
        <input type="search" aria-label="키워드 검색" value={q}
               onChange={e => setQ(e.target.value)}
               placeholder="키워드 입력 또는 아래 단추 클릭 — 쉼표로 여러 개 (예: 문화, 관광)" />
        {activeKws.length ? (
          <button type="button" className="pill" onClick={() => setQ('')}>
            선택 {activeKws.length}개 지우기</button>
        ) : null}
        <span className="count">
          {Object.values(d.keywords).flat().filter(w => !chipFilter || w.includes(chipFilter)).length.toLocaleString()}
          {' / '}{Object.values(d.keywords).flat().length.toLocaleString()}
        </span>
      </div>
      <KeyNet q={q} mode={kwMode} />
      {Object.entries(kwMode === 'general'
                       ? (d.keywords_general || {}) : d.keywords).map(([k, arr]) => {
        const hit = arr.filter(w => !chipFilter || w.includes(chipFilter));
        if (chipFilter && !hit.length) return null;
        return (
          <div className="panel" key={k} style={{marginBottom:'.8rem'}}>
            <h3>{k} <span className="mono small" style={{fontWeight:400}}>
              · {chipFilter ? `${hit.length} / ${arr.length}` : arr.length}개 — {meta[k]?.label}</span></h3>
            <div className="chips">{hit.map((w, i) => (
              <button key={i} type="button"
                className={'kwChip t-' + (meta[k]?.tone || 'plain')
                           + (activeKws.includes(w) ? ' on' : '')}
                title={activeKws.includes(w)
                       ? '분석에서 빼기'
                       : '누르면 네트워크·RAG 분석 (여러 개 가능, 최대 4)'}
                onClick={() => toggleKw(w)}>{w}</button>
            ))}</div>
          </div>
        );
      })}
      {q && !Object.values(d.keywords).flat().some(w => w.includes(q)) && (
        <div className="panel">
          <p className="empty-h">"{q}" 를 사전에서 찾지 못했습니다</p>
          <p className="small">추가하려면 <span className="mono">config/keywords.yaml</span> 을 편집하세요.</p>
          <button type="button" className="pill" onClick={() => setQ('')}>검색 초기화</button>
        </div>
      )}
    </Fragment>
  );
}
