/* ─────────────── 탭: 사용법 ───────────────
   사용설명서.md 를 **서버에서 읽어** 렌더한다. 내용을 여기 복사해 두면
   문서를 고쳤을 때 둘이 갈라진다 — 고칠 곳은 언제나 사용설명서.md 하나다. */

// 이 문서가 쓰는 마크다운만 다룬다 (제목·표·목록·인용·코드·굵게).
// 외부 라이브러리를 안 쓰는 이유: 무빌드 단일 파일 원칙(ADR-015)과
// CSP. 60줄이면 충분하고, 무엇을 지원하는지 눈으로 확인할 수 있다.
function mdInline(s) {
  const out = [];
  const re = /(\*\*[^*]+\*\*|`[^`]+`|\[[^\]]+\]\([^)]+\))/g;
  let last = 0, m;
  while ((m = re.exec(s))) {
    if (m.index > last) out.push(s.slice(last, m.index));
    const t = m[0];
    if (t.startsWith('**')) out.push(<b key={m.index}>{t.slice(2, -2)}</b>);
    else if (t.startsWith('`')) out.push(<code key={m.index}>{t.slice(1, -1)}</code>);
    else {
      const cut = t.indexOf('](');
      out.push(<b key={m.index}>{t.slice(1, cut)}</b>);   // 링크는 글자만 (로컬 경로라 클릭 무의미)
    }
    last = m.index + t.length;
  }
  if (last < s.length) out.push(s.slice(last));
  return out;
}

function Markdown({text}) {
  const lines = String(text || '').split('\n');
  const blocks = [];
  let i = 0, key = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (l.startsWith('```')) {                       // 코드 블록
      const buf = [];
      i++;
      while (i < lines.length && !lines[i].startsWith('```')) buf.push(lines[i++]);
      i++;
      blocks.push(<pre key={key++} className="md-pre">{buf.join('\n')}</pre>);
    } else if (/^\|/.test(l) && /^\|[\s:|-]+\|?$/.test(lines[i + 1] || '')) {
      const head = l.split('|').slice(1, -1).map(c => c.trim());
      i += 2;
      const rows = [];
      while (i < lines.length && /^\|/.test(lines[i])) {
        rows.push(lines[i].split('|').slice(1, -1).map(c => c.trim()));
        i++;
      }
      blocks.push(
        <div key={key++} style={{overflowX: 'auto'}}>
          <table className="md-table">
            <thead><tr>{head.map((h, j) => <th key={j}>{mdInline(h)}</th>)}</tr></thead>
            <tbody>{rows.map((r, j) => (
              <tr key={j}>{r.map((c, k) => <td key={k}>{mdInline(c)}</td>)}</tr>))}</tbody>
          </table>
        </div>);
    } else if (/^#{1,4}\s/.test(l)) {
      const lv = l.match(/^#+/)[0].length;
      const txt = l.replace(/^#+\s*/, '');
      blocks.push(lv <= 2
        ? <h3 key={key++} className="sec-title" style={{marginTop: 26}}>{mdInline(txt)}</h3>
        : <h4 key={key++} style={{margin: '18px 0 6px', fontSize: '.95rem'}}>{mdInline(txt)}</h4>);
      i++;                    // ← 이 줄을 빠뜨려 무한 루프가 났었다. 모든 분기는 i 를 전진시켜야 한다.
    } else if (/^>\s?/.test(l)) {
      const buf = [];
      while (i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ''));
      blocks.push(<blockquote key={key++} className="md-quote">{
        buf.map((b, j) => <div key={j}>{mdInline(b)}</div>)}</blockquote>);
    } else if (/^\s*\d+[.)]\s/.test(l)) {          // 번호 목록
      const buf = [];
      let start = parseInt(l.match(/\d+/)[0], 10) || 1;
      while (i < lines.length && /^\s*\d+[.)]\s/.test(lines[i])) {
        buf.push(lines[i++].replace(/^\s*\d+[.)]\s*/, ''));
      }
      blocks.push(<ol key={key++} className="md-ol" start={start}>{
        buf.map((b, j) => <li key={j}>{mdInline(b)}</li>)}</ol>);
    } else if (/^[-*]\s/.test(l)) {
      const buf = [];
      while (i < lines.length && /^[-*]\s/.test(lines[i])) buf.push(lines[i++].replace(/^[-*]\s/, ''));
      blocks.push(<ul key={key++} className="md-ul">{
        buf.map((b, j) => <li key={j}>{mdInline(b)}</li>)}</ul>);
    } else if (l.trim() === '' || /^-{3,}$/.test(l.trim())) {
      i++;
    } else {
      const buf = [];
      while (i < lines.length && lines[i].trim()
             && !/^[#>|`\-*]/.test(lines[i])
             && !/^\s*\d+[.)]\s/.test(lines[i])) buf.push(lines[i++]);
      if (buf.length) {
        // 깨진 표에서 흘러나온 파이프를 정리한다 — 「| [3] |」 같은 잔해
        const txt = buf.join(' ').replace(/\s*\|\s*/g, ' ').trim();
        if (txt) blocks.push(<p key={key++} className="md-p">{mdInline(txt)}</p>);
      }
      else i++;
    }
  }
  return <Fragment>{blocks}</Fragment>;
}

function copyText(t) {
  try {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(t);
  } catch (e) {}
  // file:// 은 secure context 가 아니라 clipboard API 가 막힌다 — 폴백
  const ta = document.createElement('textarea');
  ta.value = t;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); } catch (e) {}
  document.body.removeChild(ta);
  return Promise.resolve();
}

function CopyBtn({text, label, pri}) {
  const [done, setDone] = useState(false);
  return (
    <button className={'btn' + (pri ? ' pri' : '')} disabled={!text}
      onClick={() => { copyText(text); setDone(true); setTimeout(() => setDone(false), 1400); }}>
      {done ? '\u2713 복사됨' : (label || '복사')}
    </button>
  );
}

function fmtSize(b) {
  if (b < 1024) return b + ' B';
  if (b < 1048576) return (b / 1024).toFixed(0) + ' KB';
  return (b / 1048576).toFixed(1) + ' MB';
}

function fmtAgo(ts) {
  const sec = Math.max(0, Date.now() / 1000 - ts);
  if (sec < 90) return '방금';
  if (sec < 3600) return Math.round(sec / 60) + '분 전';
  if (sec < 86400) return Math.round(sec / 3600) + '시간 전';
  return Math.round(sec / 86400) + '일 전';
}

  useEffect(() => {

      .then((r) => { if (!r.ok) throw new Error(); return r.json(); })
      .then((d) => { if (alive) { setRows(d.proposals || []); setStale(false); } })
      .catch(() => { if (alive) setStale(true); });
    load();
    const t = setInterval(load, 5000);
    return () => { alive = false; clearInterval(t); };
  }, []);

  const [cap, setCap] = useState({});      // 이 PC 에 뭐가 깔려 있나
  useEffect(() => {
    fetch(API + '/api/health').then((r) => r.json())
      .then((d) => setCap(d)).catch(() => {});
  }, []);

  const openFolder = (path, mode) => {
    fetch(API + '/api/open', {
      method: 'POST', headers: {'Content-Type': 'application/json'},

    }).then((r) => r.json())
      .then((r) => setMsg(r.ok ? '열었습니다 — ' + r.message : '실패: ' + (r.error || '')))
      .catch(() => setMsg('서버 응답 없음'));
  };

  // 작업은 한 번에 하나다 — 최근에 손댄 폴더 하나만 크게 보여주고,
  // 나머지는 접어 둔다. 지우지 않는 이유: 폴더는 각각 독립된 작성물이고

  return (
    <section style={{margin: '18px 0 22px'}}>
      <h3 className="sec-title" style={{fontSize: 15, marginBottom: 8}}>
        작성 진행 <span className="small" style={{fontWeight: 400}}>
          {stale ? '— 서버 연결 끊김 · 아이콘을 다시 눌러 주세요'

        {hidden > 0 ? (
          <button className="btn sm" style={{marginLeft: 10}}
            onClick={() => setShowAll(!showAll)}>
            {showAll ? '접기' : '이전 작성 ' + hidden + '개 보기'}
          </button>
        ) : null}
      </h3>
      {shown.map((p) => (
        <div key={p.folder} className="panel"
          style={{marginBottom: 8, padding: '10px 14px'}}>
          <div style={{display: 'flex', flexWrap: 'wrap', gap: 10, alignItems: 'center'}}>
            <b style={{fontSize: '.85rem', flex: '1 1 240px', minWidth: 0,
                       overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap'}}>
              {p.folder}</b>
            <span className="small">{p.progress}/4 단계 · {fmtAgo(p.mtime)}</span>
            <button className="btn sm"
              title="탐색기로 작성 폴더만 엽니다"
              onClick={() => openFolder(p.path, '')}>폴더</button>
            <button className="btn sm"
              disabled={cap.claude_cli === false}
              title={cap.claude_cli === false
                ? 'claude 명령을 찾지 못했습니다 (CLI 미설치)'
                : '명령창에서 Claude Code 를 이 폴더로 엽니다'}
              onClick={() => openFolder(p.path, 'cli')}>터미널</button>
            <button className="btn sm"
              disabled={cap.claude_desktop === false}
              title={cap.claude_desktop === false
                ? 'Claude Desktop 이 설치돼 있지 않습니다'
                : 'Claude Desktop 앱에서 이 폴더를 프로젝트로 엽니다'}
              onClick={() => openFolder(p.path, 'desktop')}>데스크탑</button>
            <button className="btn pri sm"
              title="터미널과 데스크탑을 함께 엽니다"
              onClick={() => openFolder(p.path, 'both')}>둘 다 열기</button>
          </div>
          <div className="chips" style={{marginTop: 8, alignItems: 'center'}}>
            {p.steps.map((st, i) => (
              <React.Fragment key={st.k}>
                {i > 0 && <span className="small" style={{color: 'var(--muted)'}}>→</span>}
                <Chip k={st.done ? 'ok' : ''}>
                  {st.done ? '✓ ' : ''}{st.k}{st.n ? ' ' + st.n : ''}
                </Chip>
              </React.Fragment>
            ))}
          </div>
        </div>
      ))}
      {msg ? <div className="small" style={{marginTop: 4}}>{msg}</div> : null}
    </section>
  );
}


function Prepare() {
  const [srv, setSrv] = useState(null);        // null=확인중, false=서버없음
  const [nid, setNid] = useState('');
  const [slug, setSlug] = useState('');
  const [notices, setNotices] = useState([]);
  const [noticeErr, setNoticeErr] = useState('');   // 공고 목록이 빈 '이유'
  const [body, setBody] = useState('');
  const [jobs, setJobs] = useState([]);        // 업로드 이력 (모니터링)
  const [busy, setBusy] = useState(false);
  const [msg, setMsg] = useState('');

  useEffect(() => {
    fetch(API + '/api/health')
      .then((r) => r.json())
      .then((h) => { setSrv(h); return fetch(API + '/api/notices'); })
      .then((r) => r.json())
      .then((d) => {
        setNotices(d.notices || []);
        // 서버가 이유를 보내면 반드시 화면에 띄운다. 예전에는 error 를 버려서
        // DB 접속 실패가 「공고 0건」으로만 보였다 — 사용자는 "공고가 없나 보다"
        // 라고 오해하고, 진짜 원인(비밀번호 교체 후 서버 미재시작)을 못 찾는다.
        if (d.error) setNoticeErr(d.error);
      })
      .catch(() => setSrv(false));
  }, []);

  useEffect(() => {
    try {
      const raw = localStorage.getItem('choi-prepare');
      if (raw) { const v = JSON.parse(raw); setNid(v.nid || ''); setSlug(v.slug || ''); setBody(v.body || ''); }
    } catch (e) {}
  }, []);
  useEffect(() => {
    try { localStorage.setItem('choi-prepare', JSON.stringify({nid, slug, body})); } catch (e) {}
  }, [nid, slug, body]);

  // 폴더 경로도 서버가 준 값을 우선한다. 목록에 없는 공고(직접 ID 입력)일 때만
  // 화면에서 조립하되, 그건 어디까지나 표시용 추정임을 사용자가 알 수 있게 한다.
  const picked = notices.find((x) => String(x.id) === String(nid));
  const folder = picked && picked.folder
    ? picked.folder.replace(/\//g, '\\')
    : '사업계획서\\' + (nid ? nid + '_' + (slug || '무제') : '<공고ID>_<약칭>');
  const folderKnown = !!(picked && picked.folder);
  const cmdMake = nid ? 'python -m choi propose --notice-id ' + nid : '';

  // 폴더를 **실제로** 만든다. 근거팩 RAG 회수 때문에 1~3분 걸리므로
  // 작업(job)을 만들고 진행 상황을 폴링한다 — 동기로 하면 브라우저가 끊긴다.
  const [mk, setMk] = useState(null);        // {state, msg, folder, made}
  const makeFolder = (force) => {
    if (!srv) { setMk({state: 'err', msg: '서버가 없어 만들 수 없습니다.'}); return; }
    if (!nid) { setMk({state: 'err', msg: '먼저 공고를 고르세요.'}); return; }
    setMk({state: 'run', msg: '시작하는 중…'});
    fetch(API + '/api/propose', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({notice_id: nid, force: !!force}),
    }).then((r) => r.json()).then((d) => {
      if (d.error) { setMk({state: 'err', msg: d.error}); return; }
      const poll = () => fetch(API + '/api/jobs?id=' + d.job)
        .then((r) => r.json()).then((j) => {
          if (!j || j.error) { setMk({state: 'err', msg: '작업을 찾지 못했습니다.'}); return; }
          if (!j.done) { setMk({state: 'run', msg: j.current || '진행 중…'}); setTimeout(poll, 1500); return; }
          setMk(j.ok
            ? {state: 'ok', msg: j.current, folder: j.folder, made: (j.made || []).length}
            : {state: 'err', msg: j.current});
        }).catch(() => setMk({state: 'err', msg: '서버 응답이 끊겼습니다.'}));
      setTimeout(poll, 800);
    }).catch((e) => setMk({state: 'err', msg: e.message}));
  };

  // ── 목록에 없는 공고문으로 시작 (터미널 없이) ──
  // 왜 필요한가 — 대시보드 목록은 수집된 공고뿐이다. 민간 제안요청서·이메일로
  // 받은 공고문은 여기 없어서, 예전에는 터미널에 긴 경로를 손으로 쳐야 했다.
  // 코딩을 모르는 오너에게 그게 가장 실수하기 쉬운 단계였다.
  const [src, setSrc] = useState('list');   // 'list' | 'rfp'
  const [inbox, setInbox] = useState([]);
  const [rfpName, setRfpName] = useState('');
  const [rfp, setRfp] = useState(null);
  // 2·3단계 업로드가 어느 폴더로 갈지 — RFP 갈래에서 이게 없으면 목적지가 없다
  const [rfpActive, setRfpActive] = useState('');
  const loadInbox = () => fetch(API + '/api/inbox').then((r) => r.json())
    .then((d) => setInbox(d.inbox || [])).catch(() => {});
  useEffect(() => { if (srv) loadInbox(); }, [srv]);

  const uploadRfp = (files) => {
    const nm = (rfpName || '').trim();
    if (!nm) { setRfp({state: 'err', msg: '먼저 사업명을 적어 주세요.'}); return; }
    const fd = new FormData();
    files.forEach((f) => fd.append('files', f));
    fd.append('category', '받은공고문');
    fd.append('slug', nm);
    fd.append('notice_id', '0');
    setRfp({state: 'run', msg: '올리는 중…'});
    fetch(API + '/api/upload', {method: 'POST', body: fd})
      .then((r) => r.json()).then((d) => {
        if (d.error) { setRfp({state: 'err', msg: d.error}); return; }
        const poll = () => fetch(API + '/api/jobs?id=' + d.job).then((r) => r.json())
          .then((j) => {
            if (!j.done) { setRfp({state: 'run', msg: j.current || '처리 중…'}); setTimeout(poll, 1200); return; }
            setRfp({state: 'ok', msg: `${(j.files || []).length}개 저장됨 — 이제 [작성 폴더 만들기]`});
            loadInbox();
          }).catch(() => setRfp({state: 'err', msg: '서버 응답 없음'}));
        setTimeout(poll, 700);
      }).catch((e) => setRfp({state: 'err', msg: e.message}));
  };

  const makeFromRfp = (name, force) => {
    setRfp({state: 'run', msg: '시작하는 중…'});
    fetch(API + '/api/propose-rfp', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({name: name, title: name, force: !!force}),
    }).then((r) => r.json()).then((d) => {
      if (d.error) { setRfp({state: 'err', msg: d.error}); return; }
      const poll = () => fetch(API + '/api/jobs?id=' + d.job).then((r) => r.json())
        .then((j) => {
          if (!j.done) { setRfp({state: 'run', msg: j.current || '진행 중…'}); setTimeout(poll, 1500); return; }
          // 만든 즉시 2·3단계 대상이 되게 — 이름은 서버가 정한 실제 폴더명
          if (j.ok && j.folder) setRfpActive(String(j.folder).split(/[\\/]/).pop());
          setRfp(j.ok ? {state: 'ok', msg: `완료 · 파일 ${(j.made || []).length}개`, folder: j.folder}
                      : {state: 'err', msg: j.current});
          loadInbox();
        }).catch(() => setRfp({state: 'err', msg: '서버 응답이 끊겼습니다.'}));
      setTimeout(poll, 800);
    }).catch((e) => setRfp({state: 'err', msg: e.message}));
  };

  const hits = KEY_HINTS.map((h) => ({k: h.k, n: (body.match(h.re) || []).length}));
  const missing = hits.filter((h) => h.n === 0);

  // 공고를 바꾸면 약칭도 **반드시** 따라 바꾼다.
  // 예전에는 `if (!slug)` 라 옛 약칭이 남아, 1665 를 골랐는데 경로는 1617 것을
  // 가리키는 일이 있었다(실측). 사용자가 직접 고친 약칭도 공고가 바뀌면 무의미하다.
  const pickNotice = (v) => {
    setNid(v);
    const n = notices.find((x) => String(x.id) === String(v));
    // 약칭은 **서버가 준 것**을 쓴다 — 규칙을 화면에서 복제하지 않는다(단일 출처).
    setSlug(n ? (n.slug || '무제') : '');
  };

  // 업로드 — 여러 파일을 한 번에 보내고 진행을 폴링한다
  // 업로드 목적지를 한 곳에서만 정한다 — 화면에 적힌 폴더와 실제로 올라가는
  // 폴더가 어긋나면 오너는 파일을 어디로 보냈는지 알 수 없게 된다.
  const uploadTarget = src === 'rfp'
    ? rfpActive
    : (nid ? folder.replace(/^.*[\\/]/, '') : '');

  const upload = (files, category) => {
    if (!srv) { setMsg('서버가 없어 업로드할 수 없습니다.'); return; }
    // 「직접 받은 공고문」 갈래에서는 공고 번호가 없다 — 폴더를 직접 지정한다.
    // 그러지 않으면 서식을 올릴 곳이 없어 G5(형식 검사)를 영영 통과 못 한다.
    if (!uploadTarget) {
      setMsg(src === 'rfp' ? '먼저 위에서 작성 폴더를 고르세요.' : '먼저 공고를 선택하세요.');
      return;
    }
    const fd = new FormData();
    fd.append('notice_id', nid || '0');
    fd.append('slug', slug || '무제');
    if (src === 'rfp') fd.append('folder', uploadTarget);
    fd.append('category', category);
    files.forEach((f, i) => fd.append('f' + i, f, f.name));
    setBusy(true);
    setMsg(files.length + '개 전송 중…');
    fetch(API + '/api/upload', {method: 'POST', body: fd})
      .then((r) => r.json())
      .then((r) => {
        if (r.error) throw new Error(r.error);
        const poll = () => fetch(API + '/api/jobs?id=' + r.job)
          .then((x) => x.json())
          .then((j) => {
            setJobs((prev) => {
              const rest = prev.filter((p) => p.id !== j.id);
              return [{...j, category: category}].concat(rest).slice(0, 6);
            });
            if (!j.done) { setMsg(j.current || '처리 중…'); setTimeout(poll, 1200); }
            else {
              setBusy(false);
              // 서버가 업로드 직후 배점표까지 뽑아 준다 — 결과를 바로 알려준다
              setMsg('완료 — ' + (j.files || []).length + '개 처리'
                     + (j.rubric ? ' · 배점표: ' + j.rubric : ''));
            }
          });
        poll();
      })
      .catch((e) => { setBusy(false); setMsg('실패: ' + e.message); });
  };

  const openFolder = (mode) => {
    if (!srv) { setMsg('서버가 없어 폴더를 열 수 없습니다.'); return; }
    setMsg('여는 중…');
    fetch(API + '/api/open', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path: folder, mode: mode}),
    }).then((r) => r.json())
      .then((r) => setMsg(r.ok ? '열었습니다 — ' + r.message : '실패: ' + (r.error || r.message)))
      .catch((e) => setMsg('실패: ' + e.message));
  };

  const noticeMd = body.trim()
    ? ['# 공고 원문 (수동 입력)', '', '> 첨부 공고문에서 직접 옮긴 본문입니다.',
       '> 입력일: ' + new Date().toISOString().slice(0, 10), '', body.trim(), ''].join('\n')
    : '';

  const done1 = !!nid;
  const done2 = jobs.some((j) => j.category === '공고첨부') || body.trim().length > 200;
  const done3 = jobs.some((j) => j.category === '오너자료');

  return (
    <div>
      <h2 className="sec-title">사업계획서 작성 준비</h2>
      <p className="sec-desc">
        공고문과 오너 자료를 올리면 서버가 <b>PDF·WORD·EXCEL·PPT·이미지</b>에서 텍스트를 뽑아
        작성 폴더에 넣습니다. 스캔본·사진은 <b>OCR</b> 로 읽습니다.
      </p>

      {srv === null && <Call label="확인 중">서버 연결을 확인하고 있습니다…</Call>}
      {srv === false && (
        <Call tone="warn" label="서버가 꺼져 있습니다">
          업로드·OCR·폴더 열기는 로컬 서버가 필요합니다.
          프로젝트 폴더의 <code>_대시보드_시작.bat</code> 을 더블클릭해 주세요.
          지금은 <b>붙여넣기와 명령 복사만</b> 됩니다.
        </Call>
      )}
      {srv && (
        <Call tone="ok" label="서버 연결됨">
          OCR {srv.ocr ? <b>사용 가능</b> : <b>불가 (Ollama 를 켜주세요)</b>}
          {srv.ocr ? ' — ' + srv.vision_model : ''} · 작성 폴더 <code>{srv.proposal_root}</code>
        </Call>
      )}

      {srv ? <ProposalMonitor /> : null}
      <ol className="steps" style={{marginTop: 18}}>
        <li className={done1 ? 'done' : ''}>
          <b>공고를 고릅니다</b>
          {/* 두 갈래를 동시에 보여 줬더니 드롭존이 세 개로 늘어 어디에 무엇을
              올리는지 구분되지 않았다. 한 번에 한 갈래만 보이게 한다. */}
          <div className="srcTabs" role="tablist" style={{marginTop: 10}}>
            <button className="srcTab" role="tab"
              aria-selected={src === 'list'} onClick={() => setSrc('list')}>
              📋 수집된 공고에서 고르기
              <span>자동 수집 {notices.length}건 중 선택</span>
            </button>
            <button className="srcTab" role="tab"
              aria-selected={src === 'rfp'} onClick={() => setSrc('rfp')}>
              📨 직접 받은 공고문
              <span>이메일 공고 · 민간 제안요청서</span>
            </button>
          </div>

          {src === 'list' ? (
          <React.Fragment>
          <div className="controls" style={{marginTop: 12}}>
            {noticeErr ? (
              <div className="small" style={{flexBasis: '100%', color: 'var(--critical)', marginBottom: 6}}>
                ⚠️ 공고 목록을 불러오지 못했습니다 — {String(noticeErr).slice(0, 110)}
                <br />
                <b>DB 비밀번호를 바꾸셨다면</b> 바탕화면 아이콘을 다시 눌러 서버를 새로 띄우십시오.
              </div>
            ) : null}
            {notices.length > 0 ? (
              <select className="btn" style={{maxWidth: 460}} value={nid}
                onChange={(e) => pickNotice(e.target.value)}>
                <option value="">— 게이트 통과 공고 {notices.length}건 —</option>
                {notices.map((n) => (
                  <option key={n.id} value={n.id}>
                    [{n.id}] {n.title.slice(0, 44)}{n.apply_end ? ' · 마감 ' + n.apply_end : ''}
                  </option>
                ))}
              </select>
            ) : (
              <input className="btn" style={{width: 120}} placeholder="공고 ID" value={nid}
                onChange={(e) => setNid(e.target.value.replace(/\D/g, ''))} />
            )}
            <input className="btn" style={{width: 200}} placeholder="폴더 약칭"
              value={slug} onChange={(e) => setSlug(e.target.value)} />
            <button className="btn pri" disabled={!srv || !nid || (mk && mk.state === 'run')}
              title="작성 폴더를 실제로 만듭니다 — 배점표 추출 + 근거 자료 회수"
              onClick={() => makeFolder(false)}>
              {mk && mk.state === 'run' ? '만드는 중…' : '작성 폴더 만들기'}
            </button>
            <CopyBtn text={cmdMake} label="명령 복사" />
          </div>
          {nid ? (
            <div className="path" style={{marginTop: 8}}>
              {folder}
              {picked ? (
                <span style={{marginLeft: 8, fontWeight: 600,
                       color: picked.folder_exists ? 'var(--accent)' : 'var(--muted)'}}>
                  {picked.folder_exists ? '· 폴더 있음' : '· 아직 없음'}
                </span>
              ) : (
                <span style={{marginLeft: 8, color: 'var(--muted)'}}>· 추정 경로</span>
              )}
            </div>
          ) : null}
          {mk ? (
            <div className="small" style={{marginTop: 8, display: 'flex',
                 gap: 8, alignItems: 'center', flexWrap: 'wrap'}}>
              <span style={{color: mk.state === 'err' ? 'var(--critical)'
                            : mk.state === 'ok' ? 'var(--accent)' : 'var(--muted)'}}>
                {mk.state === 'run' ? '⏳ ' : mk.state === 'ok' ? '✅ ' : '⚠️ '}{mk.msg}
                {mk.state === 'ok' && mk.made ? ' · 파일 ' + mk.made + '개' : ''}
              </span>
              {mk.state === 'ok' && mk.folder ? (
                <button className="btn sm"
                  onClick={() => fetch(API + '/api/open', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({path: mk.folder, mode: ''}),
                  }).catch(() => {})}>📂 폴더 열기</button>
              ) : null}
              {mk.state === 'err' && /이미 있습니다/.test(mk.msg || '') ? (
                <button className="btn sm"
                  title="기존 폴더를 덮어씁니다 — 작성물이 사라질 수 있습니다"
                  onClick={() => { if (window.confirm('기존 작성물이 사라질 수 있습니다. 덮어쓸까요?')) makeFolder(true); }}>

                </button>

function UploadBox({label, category, onUp, disabled, folderPath}) {
  // folderPath 가 오면 제목 옆에 '저장 폴더 열기'를 단다 — 어디에 쌓이는지
  // 탐색기로 바로 확인하고, 올릴 파일을 그 옆 폴더에서 끌어올 수 있게.
  const openSaveFolder = (e) => {
    e.stopPropagation();           // 드롭존 클릭(파일 선택)과 겹치지 않게
    fetch(API + '/api/open', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({path: folderPath, mode: ''}),
    }).catch(() => {});
  };
  const [over, setOver] = useState(false);
  const ref = React.useRef(null);
  const take = (list) => {
    const a = Array.from(list || []);
    if (a.length && !disabled) onUp(a, category);
  };
  return (
    <div className={'drop' + (over ? ' over' : '')} style={{flex: 1, opacity: disabled ? .5 : 1}}
      onDragOver={(e) => { e.preventDefault(); setOver(true); }}
      onDragLeave={() => setOver(false)}
      onDrop={(e) => { e.preventDefault(); setOver(false); take(e.dataTransfer.files); }}
      onClick={() => !disabled && ref.current && ref.current.click()}>
      <div className="big">{label}</div>
      <div className="small">끌어다 놓거나 눌러서 선택 · 여러 개 가능</div>
      {folderPath ? (
        <button className="btn sm" style={{marginTop: 8}}
          title={'탐색기로 저장 위치를 엽니다: ' + folderPath}
          onClick={openSaveFolder}>📂 저장 폴더 열기</button>
      ) : null}
      <input ref={ref} type="file" multiple style={{display: 'none'}}
        onChange={(e) => { take(e.target.files); e.target.value = ''; }} />
    </div>
  );
}


// ─────────────── 오늘의 공모 브리핑 (①②③) ───────────────
// 조사 스냅샷(data.js)이 아니라 서버의 "지금 DB"를 본다.
// 서버가 없으면 숫자를 지어내지 않는다 — 없다고 말한다.

function TrendChart({points}) {
  const pts = (points || []).filter((p) => p && p.d && p.n != null);
  if (pts.length < 2) return null;
  const W = 560, H = 120, PAD = 24;
  const max = Math.max.apply(null, pts.map((p) => p.n).concat([1]));
  const xs = (i) => PAD + (W - 2 * PAD) * (i / (pts.length - 1));
  const ys = (n) => H - PAD - (H - 2 * PAD) * (n / max);
  const line = pts.map((p, i) => xs(i).toFixed(1) + ',' + ys(p.n).toFixed(1)).join(' ');
  const area = xs(0).toFixed(1) + ',' + (H - PAD) + ' ' + line + ' '
             + xs(pts.length - 1).toFixed(1) + ',' + (H - PAD);
  const last = pts[pts.length - 1];
  return (
    <div className="tw" style={{maxHeight: 'none', overflowY: 'hidden'}}>
      <svg viewBox={'0 0 ' + W + ' ' + H} style={{width: '100%', maxWidth: 640, display: 'block'}}
        role="img" aria-label="일자별 신규 공고 수집 추이">
        <polygon points={area} fill="var(--accent-soft)" opacity="0.65" />
        <polyline points={line} fill="none" stroke="var(--accent)" strokeWidth="2"
          strokeLinejoin="round" strokeLinecap="round" />
        <line x1={PAD} y1={H - PAD} x2={W - PAD} y2={H - PAD} stroke="var(--rule)" />
        <circle cx={xs(pts.length - 1)} cy={ys(last.n)} r="3.5" fill="var(--accent)" />
        <text x={PAD} y={H - 8} fontSize="10" fill="var(--muted)">{String(pts[0].d).slice(5)}</text>
        <text x={W - PAD} y={H - 8} fontSize="10" fill="var(--muted)" textAnchor="end">
          {String(last.d).slice(5)}</text>
        <text x={xs(pts.length - 1) - 6} y={ys(last.n) - 8} fontSize="11" fontWeight="700"
          fill="var(--ink)" textAnchor="end">{last.n}건</text>
      </svg>
    </div>
  );
}

        .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
        .then(setData)
        .catch(() => setErr('데이터를 불러오지 못했습니다. dashboard 폴더에 data.js 가 있는지 확인하세요.'));
    }
    // 시장 정량조사 결과 — 있으면 얹고 없으면 조용히 넘어간다
    if (window.CHOI_MARKET) setLive(window.CHOI_MARKET);
    else fetch('./market.json').then(r => r.ok ? r.json() : null).then(m => m && setLive(m)).catch(() => {});
  }, []);

  useEffect(() => { location.hash = tab; }, [tab]);

  // ── 화면 모드 (라이트 / 다크) ──
  // 예전 코드는 data-theme 속성만 읽어 뒤집었다. 시스템이 다크인데 속성이
  // 없으면 첫 클릭이 'dark' 를 세워 **아무 변화가 없었다** — 오너에겐 고장이다.
  // 지금 실제로 보이는 모드를 먼저 확정해 두고, 그걸 뒤집는다.
  // localStorage 는 사생활 모드·차단 설정에서 던지므로 반드시 감싼다.
  const [theme, setTheme] = useState('light');
  const [themePinned, setThemePinned] = useState(false);   // 사용자가 직접 골랐나

  useEffect(() => {
    let saved = null;
    try { saved = localStorage.getItem('choi-theme'); } catch (e) {}
    const mq = window.matchMedia ? window.matchMedia('(prefers-color-scheme:dark)') : null;
    const start = saved || (mq && mq.matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', start);
    setTheme(start);
    setThemePinned(!!saved);
    if (!saved && mq) {
      // 아직 직접 고르지 않았다면 시스템 설정을 계속 따라간다
      const follow = (e) => {
        const t = e.matches ? 'dark' : 'light';
        document.documentElement.setAttribute('data-theme', t);
        setTheme(t);
      };
      if (mq.addEventListener) mq.addEventListener('change', follow);
      else if (mq.addListener) mq.addListener(follow);      // 구형 사파리
      return () => {
        if (mq.removeEventListener) mq.removeEventListener('change', follow);
        else if (mq.removeListener) mq.removeListener(follow);
      };
    }
  }, []);

  const flipTheme = () => {
    const next = theme === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    setTheme(next);
    setThemePinned(true);
    try { localStorage.setItem('choi-theme', next); } catch (e) {}
  };

  if (err) return (
    <div className="wrap" style={{paddingTop:'3rem'}}>
      <Call tone="crit" label="불러오기 실패">
        <p>{err}</p>
        <p className="small">데이터 파일을 다시 만들려면 프로젝트 루트에서:</p>
        <p className="mono small">python dashboard/build_data.py</p>
        <p className="small">그래도 안 되면 로컬 서버로 여세요:
          <span className="mono"> python -m http.server 8099 --directory dashboard</span></p>
      </Call>
    </div>
  );
  if (!data) return <div className="loading">데이터를 불러오는 중…</div>;

  const Active = TABS.find(t => t.id === tab)?.C || Overview;

  return (
    <Fragment>
      <header className="mast">
        <div className="wrap mast-inner">
          <div className="mast-top">
            <div className="brand">
              <span className="sub">CHOI · 1단계</span>
              <h1>명상·심리치유 공모사업 대시보드</h1>
            </div>
            <div className="mast-meta">
              {/* 아이콘은 **바뀔 모드**를 가리킨다 (라이트일 때 🌙 = 누르면 어두워짐).
                  이모지만 있는 버튼이라 aria-label 로 무엇인지 말해 준다. */}
              <button type="button" className="themeBtn" onClick={flipTheme}
                aria-label={(theme === 'dark' ? '라이트' : '다크') + ' 모드로 전환'}
                title={'지금 ' + (theme === 'dark' ? '다크' : '라이트') + ' 모드'
                       + (themePinned ? '' : ' (시스템 설정 따름)')
                       + ' — 눌러서 ' + (theme === 'dark' ? '밝게' : '어둡게')}>
                <span aria-hidden="true">{theme === 'dark' ? '☀️' : '🌙'}</span>
                <em>{theme === 'dark' ? '라이트' : '다크'}</em>
              </button>
              <span>조사 {data.generated_at}</span>
              <span>채널 {data.channels.length}</span>
              <span>데이터셋 {data.datasets.length}</span>
              <span>공고사례 {data.programs.length}</span>
            </div>
          </div>
          {/* 탭 위젯이 아니라 해시 라우팅 페이지 전환이다.
              role="tablist" 는 방향키 이동을 약속하는데 그 약속을 지키지 않으므로 aria-current 를 쓴다. */}
          <nav aria-label="대시보드 섹션">
            {TABS.map((t, i) => {
              const n = t.n(data);
              // 행동 버튼(action) — 탭 전환이 아니라 패널을 연다
              if (t.action) return (
                <Fragment key={t.id}>
                  {i > 0 && TABS[i-1].group !== t.group && <span className="nav-sep" aria-hidden="true" />}
                  <button type="button" className="nav-act"
                          title="수집→본문→중복→게이트→RAG→화면 전체를 오늘 기준으로 갱신합니다"
                          onClick={() => setRfOpen(true)}>🔄 {t.label}</button>
                </Fragment>
              );
              return (
                <Fragment key={t.id}>
                  {i > 0 && TABS[i-1].group !== t.group && <span className="nav-sep" aria-hidden="true" />}
                  <button type="button" aria-current={tab === t.id ? 'page' : undefined}
                          onClick={() => setTab(t.id)}>
                    {t.label}{n != null && <span className="n">{n}</span>}
                  </button>
                </Fragment>
              );
            })}
          </nav>
        </div>
      </header>
      <main><div className="wrap"><Active d={data} live={live} /></div></main>
      {/* 서랍이 열려 있으면 FAB 를 숨긴다 — 작업줄과 자리가 겹친다.
          닫기·내리기는 서랍 안에 있으므로 기능 손실이 없다. */}
      {!aiOpen ? (
        <button type="button" className="aiFab" aria-label="AI 도우미 열기"
          onClick={() => setAiOpen(true)}>✨ AI 도우미</button>
      ) : null}
      {aiOpen ? (
        <AIChat tab={tab} data={data} live={live}
          msgs={aiMsgs} setMsgs={setAiMsgs} onClose={() => setAiOpen(false)} />
      ) : null}
      {rfOpen ? <RefreshPanel onClose={() => setRfOpen(false)} /> : null}

      <footer><div className="wrap">
        <p style={{margin:'0 0 .5rem'}}><b>정본 경로</b></p>
        <p className="path" style={{margin:'0 0 .2rem'}}>C:\AICAMP_CHOI\dashboard\index.html</p>
        <p className="path" style={{margin:'0 0 .7rem'}}>C:\AICAMP_CHOI\dashboard\data.js · market.js</p>
        <p style={{margin:'0 0 .4rem'}}>빌드 도구 없음 — React UMD + Babel standalone.
          데이터는 <span className="mono">data.js</span> 가 심는 전역이라 <b>파일을 더블클릭해도 열립니다.</b></p>
        <p style={{margin:0}}>데이터 갱신: <span className="mono">python dashboard/build_data.py</span></p>
      </div></footer>
    </Fragment>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
